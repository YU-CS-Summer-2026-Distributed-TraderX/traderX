# The YU06 EOD batch chain beside the cluster tier, so the extract's trigger is the real one.
#
#   price-publisher  --pricing.*-->  trade-processor  --eod.prices.ready-->  position-service
#                                          |                                       |
#                                    eod_price_snapshot                      eod_position_pnl
#                                                                                  |
#                                                                          eod.pnl.done --> risk-extract
#
# price-publisher quotes the listed option chain off its underlyings (YU15). Without it options are
# MISSING in every snapshot and YU06's fail-safe halts any account holding one, so no account with
# an option position is ever marked.
apiVersion: v1
kind: Service
metadata:
  name: price-publisher
  labels:
    app: price-publisher
spec:
  selector:
    app: price-publisher
  ports:
    - name: http
      port: 18100
      targetPort: 18100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-publisher
  labels:
    app: price-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: price-publisher
  template:
    metadata:
      labels:
        app: price-publisher
    spec:
      containers:
        - name: price-publisher
          image: traderx/price-publisher:yu17-replay-heal2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18100
          env:
            - name: PRICE_PUBLISHER_PORT
              value: "18100"
            - name: NATS_BROKER_HOST
              value: "nats"
            - name: PRICE_BOOTSTRAP_MODE
              value: "snapshot"
            # The underlyings the seeded option chain references must be present, or their
            # contracts are skipped rather than quoted off a fabricated price.
            # Widened 2026-08-27 to the tape extract's full universe (ADR-072): 99 of the median
            # extract's 100 symbols, plus the Treasuries/corporates/GOOGL/FNMA already here.
            # DOC is the deliberate omission -- it is in the extract and NOT in the stocks table,
            # and the replay's UNKNOWN_SECURITY self-heal would publish an instrument the read
            # model has no row for (the trades.accountid foreign-key shape, again).
            # The flush is one Aeron message PER TICKER (FeedAdapterMain.flush), so this raises
            # the sequenced message RATE (~4.6/s -> ~9.7/s) and not any message's size.
            # Re-run scripts/yu17/build-taq-print-sample.sh whenever this list changes.
            - name: PRICE_TICKERS
              value: "AAPL,MSFT,AMZN,GOOGL,META,NVDA,TSLA,IBM,BAC,C,JPM,GS,MS,UBS,DB,COF,DFS,FNMA,FIS,FNF,SPY,QQQ,IWM,VTI,GLD,UST-20280630,UST-20310630,UST-20360515,UST-20460515,UST-20560515,UST-20290715,UST-20330731,UST-BILL-20260910,UST-BILL-20261112,UST-BILL-20270211,UST-BILL-20270812,UST-STRIP-20280630,UST-STRIP-20310630,UST-STRIP-20360515,UST-STRIP-20560515,CORP-IBM-20330215,CORP-JPM-20310601,CORP-GS-20360315,CORP-F-20320512,AAL,ADBE,AEP,AFL,AMCR,APA,AVGO,BA,BAX,BEN,BKR,BMY,CARR,CCL,CMG,COP,CSCO,CSX,CTRA,CVX,D,DAL,DIS,DOW,DVN,F,FCX,FITB,FOXA,GILD,GLW,GM,HAL,HBAN,HPE,HPQ,HST,INTC,IPG,IVZ,KEY,KHC,KMI,KO,KR,LRCX,LUV,MCHP,MDLZ,MO,MRK,MRNA,MU,NCLH,NEE,NEM,NFLX,NKE,O,OXY,PFE,PG,PYPL,RF,SBUX,SLB,T,TFC,UPS,USB,VFC,VZ,WFC,WMB,WMT,XOM"
            # PRICE_OPTION_CONTRACTS defaults to the YU14 seeded chain; set it to "" to quote
            # equities only. PRICE_OPTION_IV / PRICE_OPTION_RATE are the model inputs, reported on
            # /health so a consumer can reproduce our marks exactly.
            # YU17 (ADR-069 rules 1-3): the session opens where the last one closed. At bootstrap
            # price-publisher mints a short-lived admin token and reads the previous PUBLISHED
            # session over HTTP -- the same shape the eod-session-close CronJob already uses, and
            # deliberately NOT a database dependency (the publisher owns no persistence).
            #
            # Rule 1 still holds through both of these: an unreachable trade-processor, a rejected
            # token or a database with no published session all fall through to the static seed and
            # the pod starts exactly as before. What is NOT safe to leave defaulted is the master
            # secret -- this rig's is not the dev literal, so an unwired publisher would 401 and
            # fall back to the seed while every price still looked completely plausible. That is
            # the ADR's trap, so the secret is wired and /health.openingSource is the check.
            #
            # `optional: true` for the same reason FRED_API_KEY carries it: a namespace without the
            # secret gets an unset variable and the module's own default, never a pod that refuses
            # to start.
            - name: TRADE_PROCESSOR_URL
              value: "http://trade-processor:18091"
            - name: AUTH_DEV_TOKEN_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: dev-token-master-secret
                  optional: true
            # Set to "0" to open from the static seed with the read switched off entirely --
            # /health then reports enabled:false, which is a DIFFERENT reading from a read that
            # ran and failed. The proof uses both.
            - name: PRICE_OPEN_FROM_PREVIOUS_CLOSE
              value: "1"
            - name: PRICE_OPTION_IV
              value: "0.25"
            - name: PRICE_OPTION_RATE
              value: "0.04"
            # YU17 (ADR-068): the real U.S. Treasury constant-maturity curve, via the FRED API.
            #
            # `optional: true` IS rule 1's mechanism, not a nicety. With no `fred-api` secret in the
            # namespace the variable is simply unset, the pod starts exactly as before and Treasury
            # prices stay synthetic — which is the arm that has to work on a conference wifi with no
            # network, no key and no account. A required secretKeyRef would turn a missing key into
            # CreateContainerConfigError and take the whole EOD chain down with it.
            #
            # The key is a human step and is NEVER committed:
            #   kubectl --context kind-traderx-yu12-cluster -n traderx \
            #     create secret generic fred-api --from-literal=apiKey=<key>
            # Deleting that secret and restarting the pod is the whole "revert before anything
            # public" story — see ADR-068's interim position.
            - name: FRED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fred-api
                  key: apiKey
                  optional: true
            # Constant-maturity yields are published ONCE A DAY. Polling faster buys nothing and
            # spends someone else's rate limit.
            - name: FRED_POLL_MINUTES
              value: "15"
            # YU17 (ADR-070): the replay clock's anchor — the fresh-epoch mint instant, stamped
            # into the replay-epoch ConfigMap by start-cluster-kind.sh / rebuild_fresh_epoch from
            # the member-0 PVC's creationTimestamp (which IS the mint; deriving it means a restamp
            # is always idempotent). Position is (now - this) x compression, derived per tick and
            # stored nowhere, so a publisher restart resumes in the right place with no
            # coordination (decision 2 — the property to protect).
            #
            # `optional: true` is ADR-068 rule 1's mechanism, exactly as for FRED_API_KEY below:
            # an unstamped namespace leaves the variable unset, taq-replay.js records the sentence
            # on /health, and every equity keeps the synthetic walk.
            - name: REPLAY_EPOCH_START_MS
              valueFrom:
                configMapKeyRef:
                  name: replay-epoch
                  key: epochStartMs
                  optional: true
            # YU17 (ADR-072): replayed prints become ORDER FLOW. The publisher submits a
            # deterministic sample of the real TAQ prints to the gateway as ordinary orders, off
            # the SAME clock taq-replay.js derives the reference from — one clock, in one process,
            # because two derivations of it could disagree and the whole ADR-070 property is that
            # they cannot.
            - name: PRINT_REPLAY_GATEWAY
              value: "http://order-matcher:18110"
            # The dedicated accounts. All >= InputEvent.REPLAY_ACCOUNT_BASE (900000), which is what
            # the MEMBERS attribute replayed flow by — an account below it would be counted as the
            # operator's and every proof that brackets its own orders would start counting these.
            # Three of them, so consecutive prints in one symbol land on different accounts and
            # the crossing pair this flow exists to create is not self-trade-prevented.
            - name: PRINT_REPLAY_ACCOUNTS
              value: "900001,900002,900003"
            # The gateway's compiled-in default (ClusterGatewayMain.riskControlToken). Set
            # explicitly rather than relied on, so changing it there is a visible break here
            # instead of a replay that silently stops enabling its own accounts.
            - name: RISK_CONTROL_TOKEN
              value: "dev-risk-control"
            # Sample DOWN from what the artifact carries (it is built for ~6 orders/s, inside
            # ADR-072's 5-20 band). 1 = replay every sampled print. Raise it to slow the flow down
            # without rebuilding the sample; it can never speed it up.
            - name: PRINT_REPLAY_STRIDE
              value: "1"
            # FIXED, and labelled as fixed on /health: TAQ's own size is 54% odd lots and would
            # need clamping against the order cap, so it would not be real either. ADR-072 replays
            # PRICES with an invented side; it makes no claim about size.
            - name: PRINT_REPLAY_QTY
              value: "10"
            # The whole revert, alongside deleting the Secret below: set to 0 and the publisher
            # goes back to being a price publisher. ADR-068 rule 1.
            - name: PRINT_REPLAY
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 18100
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            # YU17 (ADR-070): the resampled TAQ extract (~280 KB gzipped), fetched from
            # gs://traderx-501015-tick-store/replay/ into this Secret at bring-up. In the bucket
            # and on this mount it lives in memory and on the wire only — nothing durable enters
            # the repo, so ADR-068's durability rule survives without a TAQ carve-out. `optional:
            # true` for the same rule-1 reason as the env above: no Secret, no replay, loud
            # /health, working walk. Deleting the Secret and restarting this pod is the whole
            # revert.
            - name: taq-replay
              mountPath: /etc/taq-replay
              readOnly: true
            # YU17 (ADR-072): the sampled PRINTS (~780 KB gzipped, 23 symbols x 40 days x 120
            # windows x 4 prints), fetched from the same bucket prefix into this Secret at
            # bring-up. Same posture as the extract above in every respect — never durable in the
            # repo, `optional: true`, and deleting it plus restarting this pod is the revert. It
            # is a SUBSET of the extract's universe by construction (the builder reads the
            # extract to decide what to sample) and print-replay.js refuses at runtime if that
            # ever stops being true, because a replayed order needs a replayed reference.
            - name: taq-print-sample
              mountPath: /etc/taq-print-sample
              readOnly: true
      volumes:
        - name: taq-replay
          secret:
            secretName: taq-replay-extract
            optional: true
        - name: taq-print-sample
          secret:
            secretName: taq-print-sample
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: position-service
  labels:
    app: position-service
spec:
  selector:
    app: position-service
  ports:
    - name: http
      port: 18090
      targetPort: 18090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: position-service
  labels:
    app: position-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: position-service
  template:
    metadata:
      labels:
        app: position-service
    spec:
      containers:
        - name: position-service
          # `:yu17-jsrebind` is `:yu16` plus the EOD durable re-bind in EodPnlConsumer —
          # a NATS restart destroys the `eod-pnl` durable and the client never re-creates it.
          image: traderx/position-service:yu17-jsrebind
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18090
          env:
            - name: POSITION_SERVICE_PORT
              value: "18090"
            - name: DATABASE_PG_HOST
              value: "eod-price-db"
            - name: DATABASE_PG_PORT
              value: "3306"
            - name: DATABASE_NAME
              value: "traderx"
            - name: DATABASE_DBUSER
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: username
            - name: DATABASE_DBPASS
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: password
            # The EOD P&L consumer: marks positions against the named snapshot version and emits
            # eod.pnl.done — the risk extract's real trigger.
            - name: NATS_BROKER_HOST
              value: "nats"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,prometheus,info"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 18090
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
