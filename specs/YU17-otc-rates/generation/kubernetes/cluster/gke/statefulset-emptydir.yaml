apiVersion: v1
kind: Service
metadata:
  name: order-matcher-cluster
  labels:
    app: order-matcher-cluster
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: order-matcher-cluster
  ports:
    - name: health
      port: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-matcher-cluster
spec:
  serviceName: order-matcher-cluster
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: order-matcher-cluster
  template:
    metadata:
      labels:
        app: order-matcher-cluster
    spec:
      # THE POOL NAME IS THE CONTRACT; THE MACHINE TYPE BEHIND IT IS NOT GUARANTEED. A compact-
      # placement experiment deleted blp-c4d-tuned-pool and stood up `blp-compact` instead, which
      # left every branch's manifest pinning a pool that did not exist — `apply -k` then leaves all
      # three members Pending on "didn't match Pod's node affinity/selector", and the live rig only
      # worked because someone had hand-patched the selector. Recreated under THIS name 2026-08-13
      # so the manifest is true again, but as n2-standard-8: us-east1-b was out of c2d-standard-8,
      # and CPUS_ALL_REGIONS is 32, so 3 members + one untainted node is the only shape that fits.
      # Correctness proofs do not care; a BENCHMARK taken here is NOT comparable to the banked C4D
      # numbers — n2 is general-purpose Intel, not compute-optimised — so recreate the pool as
      # c4d-standard-8 (with --system-config-from-file c4d-node-system-config.yaml) before timing
      # anything. The pool also carries NO compact placement policy.
      #
      # AND ONE THING `apply -k` CANNOT FIX: a running pod's nodeSelector is immutable, so surviving
      # pods keep whatever they were created with. Correcting the spec leaves them Pending against a
      # spec that is already right, which reads exactly like a quota problem. Delete the stale pods.
      nodeSelector:
        cloud.google.com/gke-nodepool: blp-c4d-tuned-pool
      tolerations:
        - key: workload
          operator: Equal
          value: blp
          effect: NoSchedule
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          # required now that the pool guarantees one node per member (3x c4d-standard-8,
          # threadsPerCore=1, four visible physical cores):
          # a node fault can take at most ONE member (true node-fault tolerance, joint plan Ph2)
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: order-matcher-cluster
              topologyKey: kubernetes.io/hostname
      initContainers:
        # DR restore: when RESTORE_FROM_GCS=1, member-0 seeds its (emptyDir) /data from the
        # latest GCS backup before the JVM starts; members 1 & 2 come up empty and rejoin member-0
        # via the proven catch-up. No-op on normal boot. Uses the journal-archive HMAC creds.
        - name: restore-from-gcs
          image: google/cloud-sdk:latest
          # Init containers participate in pod QoS classification. Equal CPU/memory request and
          # limit keep the pod Guaranteed so static CPU Manager can pin the 3-CPU member container.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 256Mi
          env:
            - name: RESTORE_FROM_GCS
              value: "0"
            - name: GS_ID
              valueFrom: { secretKeyRef: { name: order-matcher-journal-gcs-hmac, key: access-key-id } }
            - name: GS_SECRET
              valueFrom: { secretKeyRef: { name: order-matcher-journal-gcs-hmac, key: secret-access-key } }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              ORD="${HOSTNAME##*-}"
              [ "${RESTORE_FROM_GCS:-0}" = "1" ] || { echo "restore disabled — normal boot"; exit 0; }
              [ "$ORD" = "0" ] || { echo "member $ORD rejoins fresh (only member-0 restores)"; exit 0; }
              [ -s /data/cluster/recording.log ] && { echo "/data already populated — skip restore"; exit 0; }
              echo "restoring member-0 /data from GCS latest.tgz ..."
              export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
              python3 -m pip install --break-system-packages --quiet boto3 >/dev/null 2>&1
              python3 -c "import boto3; from botocore.config import Config; boto3.client('s3',endpoint_url='https://storage.googleapis.com',aws_access_key_id='$GS_ID',aws_secret_access_key='$GS_SECRET',config=Config(signature_version='s3v4',s3={'addressing_style':'path'})).download_file('traderx-505400-order-matcher-journal-archive','yu12-cluster-snapshots/latest.tgz','/tmp/latest.tgz')"
              mkdir -p /data && tar -xzSf /tmp/latest.tgz -C /data
              echo "restored member-0: $(ls /data)"
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: cluster-node
          image: us-east1-docker.pkg.dev/traderx-505400/traderx/cluster-node:yu17-gke4
          imagePullPolicy: Always
          # sh wrapper keeps the JVM off PID 1 so a crash harness can SIGKILL it from a
          # kubectl exec (Linux blocks signals to PID 1 from inside the namespace) — a true
          # crash with a node-clock timestamp, no pod-delete API latency in the measurement.
          command: ["/bin/sh", "-c", "java -cp /opt/app/classes:/opt/app/lib/* finos.traderx.ordermatcher.cluster.ClusterNodeMain & wait $!"]
          env:
            # LEADER-SIDE KDB TAP. Off by default on this tier, and that is exactly why the
            # console's Kdb page reads empty on GKE while working on kind — nothing is broken, the
            # producer was never switched on. /data here is the node-disk emptyDir (95G, 83G free),
            # NOT the memory-backed `shm` volume, so captures cost disk rather than the members'
            # 4Gi. The tap caps itself at KDB_TAP_MAX_MB rather than competing with the consensus
            # journal that shares the volume.
            #
            # This must sit on the MEMBER container. Put on the restore initContainer above (whose
            # env block looks identical) it is set on a process that exits before the engine starts.
            - name: KDB_TAP_DIR
              value: "/data/kdb-capture"
            - name: KDB_TAP_MAX_MB
              value: "256"
            - name: CLUSTER_HOSTNAMES
              value: "order-matcher-cluster-0.order-matcher-cluster.traderx.svc.cluster.local,order-matcher-cluster-1.order-matcher-cluster.traderx.svc.cluster.local,order-matcher-cluster-2.order-matcher-cluster.traderx.svc.cluster.local"
            - name: CLUSTER_PORT_BASE
              value: "21800"
            - name: CLUSTER_HEARTBEAT_INTERVAL_MS
              value: "50"
            - name: CLUSTER_HEARTBEAT_TIMEOUT_MS
              value: "200"
            - name: CLUSTER_ELECTION_TIMEOUT_MS
              value: "100"
            - name: CLUSTER_ELECTION_STATUS_INTERVAL_MS
              value: "25"
            # LATENCY-02 verdict, shipped: override Aeron's DEFAULT BackoffIdleStrategy (max park
            # 1ms) with a 1us max park on every member agent (media driver, archive, consensus
            # module, service container). Measured on the 2026-07-24 idle-strategy sweep: client
            # RTT p50 4.85ms -> ~2.0ms (2.4x) for 0.34 core idle, ~9x less CPU than `yielding`;
            # `busyspin` was DISQUALIFIED (4 spin agents on 3 pinned cores starved consensus,
            # p99 363ms). The lever lives in ClusterNodeConfig.idleOverrideSupplier(); it had never
            # been set in ANY deployment manifest, so every cluster tier ran the 1ms-park default
            # while the recommendation existed only in the handoff docs. Do NOT set this on kind:
            # it takes precedence over CLUSTER_IDLE_SLEEP_MS, which is the correct knob there
            # (kind's idle CPU starvation needs MORE parking, not less).
            - name: CLUSTER_IDLE_STRATEGY
              value: "lowpark"
            - name: CLUSTER_BASE_DIR
              value: "/data"
            - name: CLUSTER_AERON_DIR
              value: "/dev/shm/aeron-cluster"
            - name: CLUSTER_OUTPUT_RING_SIZE
              value: "262144"
            # Snapshot is a log-position barrier: under ~134k flood the apply loop stalls a few
            # seconds while state is written, and in-flight gateway batches can exceed their ack
            # budget → a throughput dip. 60s put a barrier inside most bench runs; 300s keeps
            # typical runs (< 5 min) barrier-free while still snapshotting often enough to bound
            # restart replay (tcpSocket liveness now tolerates the longer replay without a kill).
            - name: CLUSTER_SNAPSHOT_INTERVAL_MS
              value: "300000"
            # Leader-side cluster-egress → NATS /trades bridge (YU12): every booked trade is
            # published to trade-processor, which persists Trade + Position to the DB and republishes
            # the /accounts/{id}/trades + /positions feeds the UI subscribes to. Only the leader
            # publishes; the deterministic apply thread only does a non-blocking enqueue.
            # YU15 is self-contained on GKE: it ships its own `nats` (JetStream) rather than
            # assuming the YU09 stack's nats-broker is present in the namespace.
            - name: TRADE_BRIDGE_NATS_URL
              value: "nats://nats:4222"
            # YU15: leader-side position-cut bridge. Unset leaves the marker inert (it still
            # sequences and renders on every member, it just publishes nowhere).
            - name: RISK_EXTRACT_NATS_URL
              value: "nats://nats:4222"
            # OTEL-01: tracing knobs, present-but-off on GKE. The benchmark that proves this
            # costs nothing on the trade path is a TIMING claim, so the "off" arm must be the
            # deployed default and the "on" arm must be reachable without a rebuild. Flip
            # OTEL_TRACES to "1" (both here and on the peer manifest) to take the "on" run.
            # Tracing ON for the members too, so a trace carries its CLUSTER segment and not just
            # the client->gateway hop. Off since this GKE tier was cut from the kind manifests,
            # where every throughput-costly switch defaults off — the same reason the kdb tap and
            # the recon sweep had to be turned on here. The A/B was throughput-neutral.
            #
            # Safe to roll: same image on all three, so no mixed-version window and no divergence
            # risk; readiness gates on catch-up (failureThreshold 120 x 5s), so RollingUpdate takes
            # one member at a time and each rejoins from the quorum before the next is touched.
            # Tracing also carries ZERO bytes in the log — the trace id is derived from the
            # idempotency key rather than propagated — so it cannot alter applied state.
            # Epoch-qualifies every order id the bridges emit. Unset, the trade bridge fell back
            # to "0" while ClusterRecon's audit row used its own default of "1" — two ids for one
            # epoch, from one process. Set it explicitly and both agree.
            - name: CLUSTER_EPOCH
              value: "1"
            - name: OTEL_TRACES
              value: "1"
            - name: OTEL_ENDPOINT
              value: "http://otel-collector:4318"
            # 0 = trace EVERY order. This tier is the demo/console rig, and the console's
            # trade -> order -> trace button is only demonstrable if the order it is clicked on was
            # sampled: at the old 127 (1 in 128) roughly one trade in 128 resolved and the rest 404'd,
            # which reads as a broken button rather than as sampling. Rejections escalate past the
            # mask, so the failure was invisible in exactly the case anyone tests first.
            # BEFORE A THROUGHPUT RUN, PUT THIS BACK TO 127 on both the gateway and the members. At
            # ~190k orders/s a per-order span is its own performance problem, and the banked GKE
            # numbers were taken at 127. Measured here: 10 accepted orders emitted 30 spans, so the
            # cost is ~3 spans per order, not one.
            # The gateway's and the members' values MUST match — both sides derive the verdict
            # independently from the same key, and a mismatch yields traces missing their cluster
            # segment rather than an error.
            - name: OTEL_SAMPLE_MASK
              value: "0"
            # YU05 recon + regulatory audit on this tier (FR-PTC04/05/10/20/21). PRESENT BUT OFF
            # here, same rule as KDB_TAP_DIR and OTEL_TRACES above: the live forward blotter
            # allocates per booked trade on the apply thread, and the banked GKE throughput numbers
            # were taken without it. Set RECON_BLOTTER_CAPACITY to 500000 (and RECON_POLL_INTERVAL_MS
            # to 10000 on trade-processor) for a reconciliation run — a one-value edit, no rebuild.
            # The full-history index and the audit export are built by replaying the Aeron Archive's
            # log on demand and are not retained, so nothing here enters the snapshot.
            # UNVERIFIED ON GKE: proven on the kind cluster rig 2026-08-02; there was no GKE cluster
            # to verify against when this landed.
            # TURNED ON 2026-08-20 at yaakov's call. 0 disabled the member-side journal replay
            # entirely, which made /regulatory/report answer 503 and left the incremental
            # reconciler with nothing to sweep — it reported cursor 0 / 0 missing / lastSweepAt
            # null, i.e. a clean bill of health from a check that had never once run.
            # This is a throughput trade (a 500k in-memory blotter per member), taken
            # deliberately rather than inherited.
            - name: RECON_BLOTTER_CAPACITY
              value: "500000"
            # Refuse-rather-than-truncate ceilings: a truncated full-history index reports FALSE
            # orphans, so exceeding these is an error, not a shorter answer.
            - name: RECON_FULL_HISTORY_MAX
              value: "200000"
            - name: REGULATORY_MAX_RECORDS
              value: "200000"
            # These routes span every account, so the member validates the admin claim itself
            # (ADR-025) rather than trusting the gateway that forwarded the request. The secret is
            # defined in trade-processor.yaml, which is in this same kustomization.
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-secret
            - name: JAVA_TOOL_OPTIONS
              # Heap sized for the CATALOG, not for a handful of demo names. Admitting all 533
              # reference-data instruments and touching each one allocates a YU13 book grid per
              # security; at -Xmx1536m that threw OutOfMemoryError on the clustered-service thread
              # of two members at once (2026-08-20). The service agent dies, the member stops
              # applying, and an elected leader cannot finish joinLogAsLeader with a dead service --
              # so the cluster came back leaderless and every gateway went NotReady.
              # It is a POISON PILL: the trigger is a committed log event, so a plain restart
              # re-OOMs on replay. The heap has to be raised BEFORE the members come back.
              value: "-Xms1g -Xmx3g --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          # Liveness must catch a DEAD member, not a BUSY one. An httpGet /health probe runs app
          # logic and needs the JVM's HTTP thread scheduled — under ~100k+ orders/s flood the Aeron
          # duty cycle saturates the node and starves it, so k8s SIGKILLs a perfectly-alive member
          # (exit 137) → cascading leader loss → crash-loop → recovery-replay death-spiral. A
          # tcpSocket probe is answered by the KERNEL (it completes the SYN for the listening socket
          # from the accept backlog regardless of whether the JVM accept thread runs), so a busy or
          # replaying member passes, while a dead/exited JVM (socket closed) still fails and restarts.
          # A wedged-but-alive member is handled by Raft (voted out) and by readiness (traffic shed),
          # not by liveness. Health server is also hardened (dedicated MAX_PRIORITY pool + off-path
          # /ready sampler) so /ready/metrics stay responsive for readiness + the Grafana dashboard.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            # 5s dial + 20 misses ≈ 5 min of continuous saturation tolerated before restart. Even a
            # tcpSocket probe can i/o-timeout when a multi-minute flood starves the node's network
            # softirq; a truly dead JVM (socket closed) still fails instantly and restarts. Raft +
            # readiness handle a wedged-but-alive member, so erring long here is safe.
            timeoutSeconds: 5
            failureThreshold: 20
          # Guaranteed QoS (joint plan Phase 2): request==limit so the consensus/driver duty
          # cycle never rides CFS burst credit; CPU Manager static pins three exclusive CPUs and
          # leaves ~0.9 allocatable CPU for kube/system work on each SMT-disabled C4D node.
          resources:
            requests:
              cpu: "3"
              # 4Gi: the member is alone on a 31GB C4D node. 2Gi died two ways in the 2026-07-21
              # 148k/s soak: the orderRef index array OOM'd a 512m heap at ~33M cumulative
              # orders (engine bug, see implementation-status "sweep postmortem"), and a 201MB
              # replay publication could not fit in the 512Mi shm during the ensuing catch-up.
              memory: 8Gi
            limits:
              cpu: "3"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: data
          emptyDir:
            # The Aeron consensus log + archive live here. Under high-throughput bench load the
            # archive grows fast (~10-20 MB/s at ~100k orders/s); a 2Gi cap fills in minutes and
            # k8s EVICTS the pod (cascading eviction → lost leader → throughput collapse). The
            # node's local NVMe backs this (95G, ~44GiB allocatable ephemeral) and there is one
            # member per node, so give it generous headroom. ponytail: 20Gi buys ~15-30 min of
            # sustained flood; the real bound is archive segment purge-after-snapshot if runs go
            # longer than that.
            sizeLimit: 20Gi
