# ADR-073 — the replay sandbox. A SECOND venue, deliberately not this one.
#
# The isolation here is STRUCTURAL, not a mode bit, and the structure is mostly what is ABSENT:
# TRADE_BRIDGE_NATS_URL, RISK_EXTRACT_NATS_URL and KDB_TAP_DIR are each guarded in
# MatchingEngineClusteredService by `!= null && !isBlank()`, so leaving them unset means the
# publisher is never constructed — no NATS connection, no capture file, nothing to leak through.
# Do not "disable" them by setting them to something harmless; the absence IS the mechanism.
#
# The test for any change here: if this whole StatefulSet were deleted mid-session, the live venue
# must not be able to tell.
apiVersion: v1
kind: Service
metadata:
  name: sandbox-engine
  labels:
    app: sandbox-engine
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: sandbox-engine
  ports:
    - name: health
      port: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sandbox-engine
spec:
  serviceName: sandbox-engine
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-engine
  template:
    metadata:
      labels:
        app: sandbox-engine
    spec:
      # NOT the members' pool. blp-c4d-tuned-pool is tainted for the live cluster and its three
      # nodes are sized for it; the sandbox is a guest on untainted capacity and must never
      # compete with consensus for a core.
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      terminationGracePeriodSeconds: 10
      containers:
        - name: cluster-node
          image: us-east1-docker.pkg.dev/traderx-505400/traderx/cluster-node:yu17-6374c110
          imagePullPolicy: Always
          # The members' own launch form, including the `& wait $!` that keeps signal delivery
          # working through the shell.
          command: ["/bin/sh", "-c", "java -cp /opt/app/classes:/opt/app/lib/* finos.traderx.ordermatcher.cluster.ClusterNodeMain & wait $!"]
          env:
            # ONE member. Raft with a single node is still Raft: it elects itself, commits on its
            # own vote, and applies through the identical path — which is the point, because the
            # sandbox has to match the live engine's behaviour to be worth replaying into.
            - name: CLUSTER_HOSTNAMES
              value: "sandbox-engine-0.sandbox-engine.traderx.svc.cluster.local"
            - name: CLUSTER_PORT_BASE
              value: "21800"
            - name: CLUSTER_BASE_DIR
              value: "/data"
            - name: CLUSTER_AERON_DIR
              value: "/dev/shm/aeron-cluster"
            - name: CLUSTER_IDLE_STRATEGY
              value: "lowpark"
            # Its own epoch namespace. Nothing reads across the two, but an id that could collide
            # in a log or a file name is a needless way to make two systems look like one.
            - name: CLUSTER_EPOCH
              value: "9001"
            - name: CLUSTER_SNAPSHOT_INTERVAL_MS
              value: "300000"
            # Its OWN signing key, from its OWN Secret -- never the live `auth-secrets`. The two
            # systems share no credential, so a token minted for one is refused by the other, and
            # the console has to mint deliberately for the sandbox rather than reusing what it
            # already holds. Sharing the key would work and would quietly make one credential
            # authoritative over both venues.
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sandbox-auth-secrets
                  key: jwt-secret
            # The sandbox's execution record, and the reason the results view can be honest about
            # scope. This is the engine's OWN in-process blotter -- no read model, no NATS, nothing
            # that leaves the pod -- so what it reports is exactly what THIS sandbox executed.
            # Replay three days in March and it holds three days in March; replay one symbol and it
            # holds one symbol. A results view built on the corpus instead could not tell either of
            # those from a session that never ran.
            #
            # Sized well below the live members' 500k/200k/200k: this pod is capped at 2Gi and a
            # blotter is a retained allocation, not a queue that drains. Raise it only alongside
            # the memory limit.
            - name: RECON_BLOTTER_CAPACITY
              value: "100000"
            - name: RECON_FULL_HISTORY_MAX
              value: "50000"
            - name: REGULATORY_MAX_RECORDS
              value: "50000"
            # DELIBERATELY ABSENT — see the header. TRADE_BRIDGE_NATS_URL, RISK_EXTRACT_NATS_URL,
            # KDB_TAP_DIR. Adding any of them wires this engine into the live read model, the live
            # extract, or the live analytical store, and silently ends the isolation.
            # ADR-073: this gateway may ISSUE the reset command. The live tier never sets this, and
            # that asymmetry is the ONLY thing separating the two -- the members' apply is
            # deliberately unconditional, because a member-side env check would let one member
            # refuse what its peers applied, which is divergence produced by the safety check
            # itself. Unset, the route answers 404 rather than 403: on a venue that will never
            # offer the capability, "forbidden" would tell a prober it is there.
            - name: SANDBOX_RESET_ENABLED
              value: "1"
            - name: OTEL_TRACES
              value: "0"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1536m --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          # tcpSocket, for the same reason the members use it: a busy JVM answering slowly must not
          # read as a dead one. Answered by the kernel from the accept backlog.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            # Sandbox state PERSISTS across sessions (ADR-073) — the reset control wipes it, a pod
            # restart does not.
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-gateway
  labels:
    app: sandbox-gateway
spec:
  type: ClusterIP
  selector:
    app: sandbox-gateway
  ports:
    - name: http
      port: 18110
      targetPort: 18110
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-gateway
  template:
    metadata:
      labels:
        app: sandbox-gateway
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      containers:
        - name: cluster-gateway
          image: us-east1-docker.pkg.dev/traderx-505400/traderx/cluster-node:yu17-6374c110
          imagePullPolicy: Always
          # Copied verbatim from the live gateway. The classpath is the exploded
          # /opt/app/classes:/opt/app/lib/* layout, NOT a fat jar.
          command: ["java", "-cp", "/opt/app/classes:/opt/app/lib/*", "finos.traderx.ordermatcher.cluster.ClusterGatewayMain"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # id=host:port, port = CLUSTER_PORT_BASE + memberId*100 + 2. One member, so one entry.
            - name: GATEWAY_INGRESS_ENDPOINTS
              value: "0=sandbox-engine-0.sandbox-engine.traderx.svc.cluster.local:21802"
            - name: GATEWAY_HTTP_PORT
              value: "18110"
            - name: GATEWAY_EGRESS_PORT
              value: "40470"
            - name: GATEWAY_PROBE_PORT
              value: "18111"
            - name: OTEL_TRACES
              value: "0"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dsun.net.httpserver.nodelay=true -Xms256m -Xmx768m --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          ports:
            - name: http
              containerPort: 18110
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 18111
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
# The sandbox's OWN message bus. Not a nicety: price-publisher awaits its NATS connection before
# it starts the replay driver (main.js — `await connect(...)` precedes `printReplay.start(...)`),
# so a replay pointed at an unreachable broker never replays at all. Pointing the sandbox copy at
# the LIVE broker would publish sandbox prices onto the live bus, which is the leak ADR-073 exists
# to prevent. A second small broker is the structural answer: the sandbox physically cannot reach
# the live one, rather than being trusted not to.
apiVersion: v1
kind: Service
metadata:
  name: sandbox-nats
  labels:
    app: sandbox-nats
spec:
  type: ClusterIP
  selector:
    app: sandbox-nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: websocket
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-nats
  template:
    metadata:
      labels:
        app: sandbox-nats
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      containers:
        - name: nats
          image: nats:2.14-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
            - containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        # Same ConfigMap as the live broker — it is configuration, not state, and reusing it means
        # the two brokers cannot drift into behaving differently.
        - name: config
          configMap:
            name: nats-server-config
        - name: data
          emptyDir: {}
---
# The replay driver. This is the LIVE publisher's image and code, pointed at the sandbox: same
# print-replay.js, so the one-clock and deterministic-by-position properties ADR-072 documented
# carry over unchanged instead of being re-derived in a second implementation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-replay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-replay
  template:
    metadata:
      labels:
        app: sandbox-replay
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      containers:
        - name: price-publisher
          image: us-east1-docker.pkg.dev/traderx-505400/traderx/price-publisher:yu17-487608ee
          imagePullPolicy: Always
          env:
            # ON here, and only here. The live publisher runs PRINT_REPLAY=0 (ADR-073).
            - name: PRINT_REPLAY
              value: "1"
            - name: PRINT_REPLAY_GATEWAY
              value: "http://sandbox-gateway:18110"
            - name: PRINT_REPLAY_ACCOUNTS
              value: "900001,900002,900003"
            - name: PRINT_REPLAY_QTY
              value: "10"
            - name: PRINT_REPLAY_STRIDE
              value: "1"
            # The sandbox's OWN clock stamp, in its OWN ConfigMap. Where this points IS where the
            # tape is, which makes it the date control: write a different epochStartMs and the
            # session dives to a different point in the corpus. Deliberately not the live
            # `replay-epoch` ConfigMap — two venues sharing one clock would be one venue.
            # `optional: true` so an unstamped sandbox walks synthetically and says so on /health,
            # rather than failing to start (ADR-068 rule 1).
            - name: REPLAY_EPOCH_START_MS
              valueFrom:
                configMapKeyRef:
                  name: sandbox-replay-epoch
                  key: epochStartMs
                  optional: true
            # The sandbox bus, NEVER `nats`. This one line is the difference between an isolated
            # sandbox and a second writer on the live system.
            - name: NATS_BROKER_HOST
              value: "sandbox-nats"
            - name: PRICE_PUBLISHER_PORT
              value: "18100"
            - name: PRICE_BOOTSTRAP_MODE
              value: "snapshot"
            - name: PRICE_TICKERS
              value: "AAPL,MSFT,AMZN,GOOGL,META,NVDA,TSLA,IBM,BAC,C,JPM,GS,MS,UBS,DB,COF,DFS"
          ports:
            - containerPort: 18100
          volumeMounts:
            - name: taq-replay
              mountPath: /etc/taq-replay
            - name: taq-print-sample
              mountPath: /etc/taq-print-sample
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        # Read-only inputs, shared with the live publisher on purpose: the corpus is the same
        # corpus, and copying it would create two things that can disagree.
        - name: taq-replay
          secret:
            secretName: taq-replay-extract
            optional: true
        - name: taq-print-sample
          secret:
            secretName: taq-print-sample
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-replay
  labels:
    app: sandbox-replay
spec:
  type: ClusterIP
  selector:
    app: sandbox-replay
  ports:
    - name: http
      port: 18100
      targetPort: 18100
