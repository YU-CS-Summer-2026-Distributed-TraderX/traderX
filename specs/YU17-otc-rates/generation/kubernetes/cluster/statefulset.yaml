apiVersion: v1
kind: Service
metadata:
  name: order-matcher-cluster
  labels:
    app: order-matcher-cluster
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: order-matcher-cluster
  ports:
    - name: health
      port: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-matcher-cluster
spec:
  serviceName: order-matcher-cluster
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: order-matcher-cluster
  template:
    metadata:
      labels:
        app: order-matcher-cluster
    spec:
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: order-matcher-cluster
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cluster-node
          # YU17's OWN declaration (layer created 2026-08-18; previously YU17 composed YU16's
          # layer and the derive machinery REFUSED to guess an image — this layer is the durable
          # fix its refusal message asked for). The `:yu17-ackB` tag is the current YU17 build
          # (option B keyed ack correlation, rig-proven 2026-08-18). Do NOT "tidy" this to the
          # derived `:yu17` — that local tag is a stale 4-day-old spare, not this state's build.
          # Wire rule: pre-B and post-B builds never mix, either direction, any branch.
          # NOTE ON WORDING: tags in these comments are written `:yu17` / `:yu17-ackB` rather than
          # as full image refs ON PURPOSE. declared_cluster_image() greps this file for the FIRST
          # traderx/cluster-node:<tag> and takes head -1, so a full ref inside a COMMENT above the
          # image line becomes the declared image. That bit a coordinator on 2026-08-18.
          # 2026-08-19: `:yu17-jsrebind` is `:yu17-ackB` plus ONE class. Measured on the
          # artifacts, not inferred: a class-by-class md5 of both images gives 265 classes each
          # and exactly one difference, RiskExtractMain — the EOD durable re-bind after a NATS
          # reconnect. The deterministic core, the gateway and every member class are BYTE-
          # IDENTICAL, which is why this rolled without minting a fresh epoch. Wire rule is
          # unchanged: this is still a post-B build and never mixes with a pre-B one.
                    # `:yu17-tick` (2026-08-24) is `:yu17-band` plus ONE class, FeedAdapterMain -- the ADR-045
          # adapter's envelope parse (payload.price) and session keepalive, neither of which the
          # deterministic core loads. Measured on the artifacts for the parse-only predecessor
          # (`:yu17-feed`): a class-by-class md5 against `:yu17-band` gave 266 classes each and
          # exactly one difference, so the core, gateway and every member class are byte-identical
          # and this rolls without semantic change (the suite still mints a fresh epoch on a tag
          # mismatch, which is fine). Wire rule unchanged: post-B, never mixes with pre-B.
          image: traderx/cluster-node:yu17-adr072
          imagePullPolicy: IfNotPresent
          env:
            # lowpark is the latency campaign's SHIPPED recommendation (2026-07-24: RTT p50
            # 4.85->~2.0ms on the bench rig, ~0.34c idle). Set live on this rig 2026-08-18 and
            # mirrored here so declared matches running; remove both together or neither.
            # Env-only + same binary, so a rolling restart is semantically safe.
            - name: CLUSTER_IDLE_STRATEGY
              value: "lowpark"
            - name: CLUSTER_HOSTNAMES
              value: "order-matcher-cluster-0.order-matcher-cluster.traderx.svc.cluster.local,order-matcher-cluster-1.order-matcher-cluster.traderx.svc.cluster.local,order-matcher-cluster-2.order-matcher-cluster.traderx.svc.cluster.local"
            - name: CLUSTER_PORT_BASE
              value: "21800"
            - name: CLUSTER_BASE_DIR
              value: "/data"
            - name: CLUSTER_AERON_DIR
              value: "/dev/shm/aeron-cluster"
            # Analytical capture for the KDB-X tick store (brief 06). Leader-side, off-consensus,
            # best-effort: this directory is NOT the Aeron Archive, holds nothing recovery needs,
            # and can be wiped without touching correctness. Unset it and the tap never starts.
            # It shares the volume with the Archive, so the tap caps itself (KDB_TAP_MAX_MB, 256
            # default) rather than ever competing for the disk the consensus journal needs.
            - name: KDB_TAP_DIR
              value: "/data/kdb-capture"
            # YU15: leader-side position-cut bridge. Unset leaves the marker inert (it still
            # sequences and renders on every member, it just publishes nowhere).
            - name: RISK_EXTRACT_NATS_URL
              value: "nats://nats:4222"
            # ADR-048 leader-side trade bridge: booked fills to NATS /trades, where
            # trade-processor persists them. Options only reach SQL at all with this set.
            - name: TRADE_BRIDGE_NATS_URL
              value: "nats://nats:4222"
            # OTEL-01: the member half of the trace. Only the LEADER emits (a follower's
            # commit-to-apply is not the round-trip the client is waiting on), so all three carry
            # the same config and the role decides. OTEL_SAMPLE_MASK MUST match the gateway's —
            # both sides derive the sampling verdict independently from the idempotency key, so a
            # mismatched mask yields member spans whose parent was never emitted.
            - name: OTEL_TRACES
              value: "1"
            - name: OTEL_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OTEL_SAMPLE_MASK
              value: "0"
            # YU05 recon + regulatory audit on this tier (FR-PTC04/05/10/20/21). The forward window
            # a reconciliation sweep classifies against the projection; the full-history index and
            # the audit export are built by replaying the Aeron Archive's log on demand and are not
            # retained. Unset leaves every /recon and /regulatory route 503 and the apply path
            # byte-for-byte what it was — the capability is opt-in, not a silent default.
            - name: RECON_BLOTTER_CAPACITY
              value: "500000"
            # Refuse-rather-than-truncate ceilings. A truncated full-history index reports FALSE
            # orphans, so exceeding this is an error, not a shorter answer. Sized for a 512Mi heap
            # that is also running a consensus member: ~200k trades is ~40MB of shadow index.
            - name: RECON_FULL_HISTORY_MAX
              value: "200000"
            - name: REGULATORY_MAX_RECORDS
              value: "200000"
            # These routes span every account, so the member validates the admin claim itself
            # (ADR-025) rather than trusting the gateway that forwarded the request.
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-secret
            # -Daeron.driver.timeout IS THE OTHER HALF OF THE REPLAY PROBLEM, and no probe can reach
            # it. During the same 4.08M-sequence replay the startupProbe below is sized for, the
            # Aeron client conductor was starved for 29s and the member exited ITSELF:
            #   DriverTimeoutException: FATAL - MediaDriver (/dev/shm/aeron-cluster)
            #     keepalive: age=29052ms > timeout=10000ms   -> "exiting client..." -> exit 70
            # Two of the three members last exited 70, not 137, which is the tell that this is an
            # in-JVM starvation bound and not a kubelet kill. A startupProbe cannot help: the
            # process killed the process.
            #
            # The driver here is EMBEDDED (ClusteredMediaDriver, same JVM as the consensus module
            # and the service container), so this timeout can only ever detect the JVM starving
            # itself -- the out-of-process driver death it was designed for cannot happen. 10s is
            # Aeron's default for a driver in another process; 300s is 10x the largest starvation
            # gap measured, and still well inside the 1800s startup window below, so a member that
            # is genuinely wedged is still restarted, just not for being busy.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -Daeron.driver.timeout=300000 --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          # A LONG REPLAY IS NOT A HANG, AND LIVENESS ALONE CANNOT TELL THEM APART.
          #
          # Measured 2026-08-25 at epoch sequence ~4,079,561: election CANVASS -> CLOSED took 60s
          # and the first apply landed 270s after that -- ~331s from container start against a
          # liveness budget of initialDelaySeconds 45 + 20 x 15s = 345s. The members were killed
          # mid-replay and had to replay the whole log again, which re-incurred the same 331s: a
          # self-sustaining loop that ran at least 13 hours (restarts 63/59/63, feed-adapter 97).
          # (issues/resolved/a-large-epochs-replay-outlasts-the-members-liveness-budget.md)
          #
          # A startupProbe is the platform's own answer and needs nothing built: while it is
          # FAILING, liveness and readiness are both SUSPENDED, and liveness only begins once it
          # has succeeded once. cluster-gateway has carried one since it was written (gateway.yaml,
          # /live on 18111); the members simply never had one. tcpSocket on 8080 is the right
          # predicate for the same reason it is the right liveness predicate below -- the kernel
          # answers from the accept backlog -- and the member's HTTP server does not accept at all
          # until replay is done, which is precisely the transition this probe has to detect.
          #
          # SIZED FROM THE BOUND, NOT FROM TASTE. The archive lives on the 1Gi PVC declared at the
          # bottom of this file and a framed log entry is 96 bytes, so no epoch this rig can carry
          # exceeds ~11M entries. Replay ran 4.08M in ~270s (~15k/s), so the LARGEST epoch the PVC
          # can hold replays in ~12 minutes. 10s x 180 = 1800s is 2.5x that. It bounds STARTUP
          # only: after the first success the 345s liveness budget below applies unchanged, and a
          # member that never starts at all is still restarted -- at 30 minutes instead of never.
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            # /ready reads a cached flag off a MAX_PRIORITY handler thread, so 2s covers
            # scheduling jitter under contention; misclassifying ready is recoverable (traffic
            # shed, next probe corrects), so short is safe HERE in a way it is not for liveness.
            timeoutSeconds: 2
            failureThreshold: 24
          # Liveness must catch a DEAD member, not a BUSY one. The httpGet /health form killed all
          # three members SIMULTANEOUSLY on kind (2026-08-24, restarts 9/10/11 overnight): the k8s
          # default timeoutSeconds=1 makes a slowly-answering member read identically to a dead
          # one, and CPU contention is node-global, so a per-member guard fired as a quorum kill —
          # then each restart lost a race with its own Aeron mark file, costing 2-3 restarts per
          # kill. Same failure already measured and fixed on the GKE flood tier
          # (gke/statefulset-emptydir.yaml); this is that stanza. A tcpSocket probe is answered by
          # the KERNEL from the accept backlog regardless of whether the JVM thread schedules, so
          # busy-but-alive passes while a dead/exited JVM (socket closed) still fails instantly.
          # A wedged-but-alive member is handled by Raft (voted out) and readiness (traffic shed),
          # not by liveness.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            # 5s dial + 20 misses ≈ 5 min of continuous saturation tolerated before restart. Even
            # a tcpSocket probe can i/o-timeout when saturation starves the node's network
            # softirq; a truly dead JVM still fails instantly. Erring long here only delays
            # restarting a zombie process (main dead, non-daemon threads holding the pod up) —
            # Raft + readiness already contain it meanwhile — while erring short is the measured
            # quorum kill. Both gradients checked, long side wins.
            timeoutSeconds: 5
            failureThreshold: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
