<div class="platform-page p-4">
    <h2>Gateway metrics</h2>
    <p class="text-muted small mb-3">
        Aggregated across every gateway, not read from one.
    </p>

    <div class="row g-2 align-items-end mb-3">
        <div class="col-auto">
            <label class="form-label small mb-1" for="mFilter">Filter</label>
            <input id="mFilter" class="form-control form-control-sm" [(ngModel)]="filter" name="mFilter">
        </div>
        <div class="col-auto">
            <button class="btn btn-sm btn-outline-primary" type="button" (click)="load()" [disabled]="loading">
                {{ loading ? 'Reading...' : 'Refresh' }}
            </button>
        </div>
    </div>

    <div class="alert alert-warning py-2 px-3" *ngIf="error">
        Cannot read metrics: {{ error }}
    </div>

    <div class="table-responsive" *ngIf="!error">
        <table class="table table-sm table-striped align-middle">
            <thead><tr><th>Series</th><th class="text-end">Value</th></tr></thead>
            <tbody>
                <tr *ngFor="let s of series">
                    <td class="small font-monospace">{{ s.name }}</td>
                    <td class="text-end">{{ s.value }}</td>
                </tr>
                <tr *ngIf="series.length === 0">
                    <td colspan="2" class="text-muted">Nothing matches that filter.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
