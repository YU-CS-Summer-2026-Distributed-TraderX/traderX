# MariaDB for the local kind runtime. The Postgres->MariaDB migration switched every service to the
# MariaDB JDBC driver (jdbc:mariadb://database:3306, MariaDBDialect) and updated the GKE/staging
# database, but the base kind database-deployment (from state 010's overlay patch) was never migrated
# and still ran postgres:16-alpine on 5432 — so on kind the MariaDB-client services could never
# connect (they target database:3306). This override brings the kind database in line with the
# service configs and production (mariadb:11.4), mirroring cluster-addons/yu03-staging/database.yaml.
# MariaDB runs /docker-entrypoint-initdb.d/*.sql the same as Postgres, so the existing
# database-init-sql ConfigMap is reused unchanged.
# YU09 (ops-hardening): credentials come from the mariadb-credentials Secret (created out-of-band,
# never committed — see quickstart.md), the same pattern as YU07's tick-store-gcs-hmac Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: traderx
  labels:
    app: database
spec:
  replicas: 1
  # Recreate: the datadir PVC is ReadWriteOnce; a rolling update would deadlock with
  # old and new pods both claiming it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      # Applies 900-migrations.sql to an already-populated PVC before the serving
      # container starts (the entrypoint only runs init SQL on an EMPTY volume, so state
      # schema/seed changes would otherwise silently never reach a persistent datadir).
      # Fresh volume: exits immediately and the entrypoint initializes + seeds. A failed
      # migration blocks serving (Init:Error) instead of running on a stale schema.
      initContainers:
        - name: schema-migrate
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              if [ ! -d /var/lib/mysql/mysql ]; then
                echo "fresh datadir - entrypoint will initialize and seed"
                exit 0
              fi
              echo "populated datadir - applying idempotent migrations"
              docker-entrypoint.sh mariadbd --skip-networking --socket=/tmp/migrate.sock &
              srv=$!
              ok=""
              for i in $(seq 1 60); do
                if mariadb --socket=/tmp/migrate.sock -uroot -p"$MARIADB_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; then ok=1; break; fi
                sleep 2
              done
              [ -n "$ok" ] || { echo "temp mariadbd never became ready"; exit 1; }
              mariadb --socket=/tmp/migrate.sock -uroot -p"$MARIADB_ROOT_PASSWORD" "$MARIADB_DATABASE" < /migrations/900-migrations.sql
              mariadb-admin --socket=/tmp/migrate.sock -uroot -p"$MARIADB_ROOT_PASSWORD" shutdown
              wait $srv
              echo "migrations applied"
          env:
            - name: MARIADB_DATABASE
              value: "traderx"
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: root-password
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
            - name: database-init-sql
              mountPath: /migrations/900-migrations.sql
              subPath: 900-migrations.sql
      containers:
        - name: database
          image: mariadb:11.4
          # Write-throughput tuning: larger buffer pool + higher io_capacity than the 128M/200
          # defaults (flush=2 already avoids per-commit fsync). Bump buffer-pool higher on GKE if
          # the node has the memory; 512M keeps the pod schedulable on a laptop kind node too.
          args: ["--lower-case-table-names=1", "--innodb-flush-log-at-trx-commit=2", "--innodb-buffer-pool-size=512M", "--innodb-io-capacity=2000"]
          imagePullPolicy: IfNotPresent
          # Guaranteed floor so the DB isn't BestEffort/starvable under load (was no resources).
          # Burstable: modest requests schedule on kind, high limits use GKE headroom.
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
          ports:
            - name: mariadb
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_DATABASE
              value: "traderx"
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: root-password
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
            - name: database-init-sql
              mountPath: /docker-entrypoint-initdb.d/001-initialSchema.sql
              subPath: 001-initialSchema.sql
            - name: database-init-sql
              mountPath: /docker-entrypoint-initdb.d/900-migrations.sql
              subPath: 900-migrations.sql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -u\"$MARIADB_USER\" -p\"$MARIADB_PASSWORD\" --silent"]
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -u\"$MARIADB_USER\" -p\"$MARIADB_PASSWORD\" --silent"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -u\"$MARIADB_USER\" -p\"$MARIADB_PASSWORD\" --silent"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: database-data
        - name: database-init-sql
          configMap:
            name: database-init-sql
