server.port=${ACCOUNT_SERVICE_PORT:18088}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mariadb://${DATABASE_PG_HOST:localhost}:${DATABASE_PG_PORT:3306}/${DATABASE_NAME:traderx}
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${DATABASE_DBUSER:traderx}
spring.datasource.password=${DATABASE_DBPASS:traderx}
spring.threads.virtual.enabled=true

people.service.url=${PEOPLE_SERVICE_URL:http://${PEOPLE_SERVICE_HOST:localhost}:18089}

server.max-http-request-header-size=1000000
springdoc.swagger-ui.disable-swagger-default-url=true

# Durable control outbox (ADR-021) — publishes account existence/identity deltas to JetStream.
outbox.publisher.enabled=${ACCOUNT_OUTBOX_ENABLED:true}
outbox.publisher.poll-interval-ms=${ACCOUNT_OUTBOX_POLL_INTERVAL_MS:250}
nats.address=${NATS_ADDRESS:nats://${NATS_BROKER_HOST:localhost}:4222}

management.endpoints.web.exposure.include=health,prometheus
