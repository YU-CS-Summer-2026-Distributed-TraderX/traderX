server.port=0
spring.datasource.url=jdbc:h2:mem:testdb;MODE=LEGACY
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
people.service.url=http://localhost:18089

# Keep the scheduled outbox poller from ever firing in tests — it would otherwise try to connect
# to a NATS broker that doesn't exist in this test environment. Dedicated outbox tests construct
# their own AccountOutboxPublisher instance with a fake ControlFeedPublisher instead of relying on
# the real scheduled bean (see AccountOutboxPublisherTest).
outbox.publisher.enabled=false
