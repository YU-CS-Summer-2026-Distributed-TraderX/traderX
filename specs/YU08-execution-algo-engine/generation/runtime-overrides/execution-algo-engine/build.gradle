plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.14'
  id 'io.spring.dependency-management' version '1.1.7'
}

ext['tomcat.version'] = '10.1.55'

group = 'finos.traderx.execution-algo-engine'
version = '0.1.0'

java {
  sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'io.nats:jnats:2.20.5'
  // VWAP volume-profile query over YU07's unified ticks Parquet store (research.md Decision 7,
  // ADR-031) — same DuckDB engine tick-store already uses from Python, here from Java.
  implementation 'org.duckdb:duckdb_jdbc:1.1.3'
  implementation 'org.apache.logging.log4j:log4j-api:2.25.4'
  implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.25.4'

  implementation ('ch.qos.logback:logback-core:1.5.32') {
    because 'version brought in by spring boot 3.5.14 affected by CVE-2024-12798'
  }
  implementation 'ch.qos.logback:logback-classic:1.5.32'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
}
