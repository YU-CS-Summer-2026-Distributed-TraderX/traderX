server.port=${ALGO_ENGINE_PORT:18120}

nats.address=${NATS_ADDRESS:nats://${NATS_BROKER_HOST:localhost}:4222}
order.matcher.url=${ORDER_MATCHER_URL:http://${ORDER_MATCHER_HOST:localhost}:18110}
price.service.url=${PRICE_SERVICE_URL:http://${PRICE_SERVICE_HOST:localhost}:18100}

# TWAP/VWAP scheduling (data-model.md).
algo.bucket-seconds-default=${ALGO_BUCKET_SECONDS_DEFAULT:10}
algo.limit-offset-bps=${ALGO_LIMIT_OFFSET_BPS:10}
algo.scheduler.tick-ms=${ALGO_SCHEDULER_TICK_MS:1000}

# VWAP volume profile (research.md Decision 7, ADR-031): synthetic needs no data; duckdb queries
# YU07's tick store and falls back to synthetic automatically on zero matching rows.
algo.volume-profile.source=${ALGO_VOLUME_PROFILE_SOURCE:synthetic}
algo.volume-profile.duckdb.path=${ALGO_VOLUME_PROFILE_DUCKDB_PATH:gs://traderx-501015-tick-store/ticks}
# TD-AE01: bound the scan to the symbol's own recent partitions instead of a full-store glob.
# lookback-days = calendar-day window averaged into the profile; as-of = window end (blank = today,
# set to a date to point at a frozen historical store).
algo.volume-profile.lookback-days=${ALGO_VOLUME_PROFILE_LOOKBACK_DAYS:30}
algo.volume-profile.as-of=${ALGO_VOLUME_PROFILE_AS_OF:}

# Workload health (AlgoEngineHealthIndicator): NATS event-store + fill-subscriber liveness
# feeds READINESS (unroute on broker loss), not liveness (don't restart-loop on an outage).
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,algoEngine

logging.level.root=info
