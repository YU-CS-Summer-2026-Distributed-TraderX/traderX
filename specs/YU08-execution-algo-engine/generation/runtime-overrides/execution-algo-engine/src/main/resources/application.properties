server.port=${ALGO_ENGINE_PORT:18120}

nats.address=${NATS_ADDRESS:nats://${NATS_BROKER_HOST:localhost}:4222}
order.matcher.url=${ORDER_MATCHER_URL:http://${ORDER_MATCHER_HOST:localhost}:18110}
price.service.url=${PRICE_SERVICE_URL:http://${PRICE_SERVICE_HOST:localhost}:18100}

# TWAP/VWAP scheduling (data-model.md).
algo.bucket-seconds-default=${ALGO_BUCKET_SECONDS_DEFAULT:10}
algo.limit-offset-bps=${ALGO_LIMIT_OFFSET_BPS:10}
algo.scheduler.tick-ms=${ALGO_SCHEDULER_TICK_MS:1000}

# VWAP volume profile (research.md Decision 7, ADR-031): synthetic needs no data; duckdb queries
# YU07's tick store and falls back to synthetic automatically on zero matching rows.
algo.volume-profile.source=${ALGO_VOLUME_PROFILE_SOURCE:synthetic}
algo.volume-profile.duckdb.path=${ALGO_VOLUME_PROFILE_DUCKDB_PATH:gs://traderx-501015-tick-store/ticks}

logging.level.root=info
