server.port=${POSITION_SERVICE_PORT:18090}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mariadb://${DATABASE_PG_HOST:localhost}:${DATABASE_PG_PORT:3306}/${DATABASE_NAME:traderx}
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${DATABASE_DBUSER:traderx}
spring.datasource.password=${DATABASE_DBPASS:traderx}
spring.threads.virtual.enabled=true

server.max-http-request-header-size=1000000
springdoc.swagger-ui.disable-swagger-default-url=true

# EOD batch chain (state YU06, ADR-027/028): durable JetStream consumer of EOD_PRICES_READY that
# marks positions against the exact (session_date, version) snapshot named in the event, then
# publishes eod.pnl.done. eod.consumer.enabled=false disables the subscription (tests) without
# touching the marking/DB logic, which is exercised directly.
nats.address=${NATS_ADDRESS:nats://${NATS_BROKER_HOST:localhost}:4222}
eod.consumer.enabled=${EOD_CONSUMER_ENABLED:true}
eod.stream=${EOD_STREAM:TRADERX_EOD}
eod.subject.prices-ready=${EOD_SUBJECT_PRICES_READY:eod.prices.ready}
eod.subject.pnl-done=${EOD_SUBJECT_PNL_DONE:eod.pnl.done}
eod.consumer.durable=${EOD_CONSUMER_DURABLE:eod-pnl}

# ADR-102 cutover (YU18, 2026-11-08): the blotter reads booked trades from the history store (ClickHouse, the
# trade system of record) and overlays SQL's exception rows (Rejected, forced Settled). t-plus-days is
# trade-processor's own settlement rule, so a history row's state matches what it would have booked.
traderx.history.url=${HISTORY_URL:http://clickhouse:8123}
traderx.blotter.limit=${BLOTTER_LIMIT:100}
settlement.t-plus-days=${SETTLEMENT_T_PLUS_DAYS:1}
