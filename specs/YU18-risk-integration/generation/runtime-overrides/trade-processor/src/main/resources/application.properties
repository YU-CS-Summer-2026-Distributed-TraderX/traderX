server.port=${TRADE_PROCESSOR_SERVICE_PORT:18091}
server.forward-headers-strategy=framework

# YU18: rewriteBatchedStatements folds a JDBC batch into multi-row statements. Measured on the
# shipped tables (1000-row batches): orderbook upsert 32K -> 90-97K rows/s, positions upsert
# 48-53K -> 215-255K rows/s. Without it each batched row is still its own statement on the wire.
spring.datasource.url=jdbc:mariadb://${DATABASE_PG_HOST:localhost}:${DATABASE_PG_PORT:3306}/${DATABASE_NAME:traderx}?rewriteBatchedStatements=true
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${DATABASE_DBUSER:traderx}
spring.datasource.password=${DATABASE_DBPASS:traderx}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.data.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.data.jpa.show-sql=false
# validate, NOT none: schema ships in the database-init-sql configmap, whose 001 key only runs
# against an EMPTY data directory, so a long-lived volume drifts from the pack silently. Twice
# now that drift was found only when queries started failing (orderbook.status CHECK, then
# orderbook.traceid - 271 rejected writes). validate turns it into a startup refusal that names
# the column; SchemaValidationFailureAnalyzer names the fix. Never 'update': this service must
# not mutate a shared schema. Covered by SchemaMatchesShippedDdlIT (both arms).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.threads.virtual.enabled=true

# Batch inserts/updates into multi-row statements instead of one round trip per row.
# TradeFeedHandler.processTrades() calls saveAll() on trades/positions per batch; without this,
# Hibernate still issues one statement per entity even inside saveAll().
# YU18: 1000 to match the feed handlers' BATCH_SIZE.
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

nats.address=${NATS_ADDRESS:nats://${NATS_BROKER_HOST:localhost}:4222}

# --- YU18 downstream redesign (docs/engineering/downstream-at-400k.md). Defaults = today's behaviour.
# feed.mode=jetstream pulls /trades and /orders from the TRADERX_FEED capture stream (replayable;
# lag instead of loss) with one durable consumer per OWNED partition; the bridges publish on
# /trades.<accountId mod P> when BRIDGE_PARTITIONS=P>1. owned="all" or "0,2".
traderx.feed.mode=${PROJECTION_FEED_MODE:core}
traderx.feed.partition-count=${PROJECTION_FEED_PARTITIONS:1}
traderx.feed.owned=${PROJECTION_FEED_OWNED:all}
traderx.feed.stream=${PROJECTION_FEED_STREAM:TRADERX_FEED}
traderx.feed.stream-max-bytes=${PROJECTION_FEED_STREAM_MAX_BYTES:8589934592}
traderx.feed.stream-max-age-hours=${PROJECTION_FEED_STREAM_MAX_AGE_HOURS:24}
traderx.feed.fetch-wait-ms=${PROJECTION_FEED_FETCH_WAIT_MS:200}
# order-feed.persist=false: no orderbook row per order event; GET /accounts/{id}/orders answers
# from the in-memory OrderView (open orders + the last terminal-capacity terminal ones), rebuilt on
# restart from the last replay-seconds of the stream (jetstream mode only).
traderx.order-feed.persist=${ORDER_FEED_PERSIST:true}
traderx.order-view.terminal-capacity=${ORDER_VIEW_TERMINAL_CAPACITY:50000}
traderx.order-view.replay-seconds=${ORDER_VIEW_REPLAY_SECONDS:300}

# To avoid "Request header is too large" when application is backed by oidc proxy.
server.max-http-request-header-size=1000000
springdoc.swagger-ui.disable-swagger-default-url=true

# SQL/bind-param debug logging serializes every statement to a string on every trade; leave off
# under load. Re-enable locally when debugging a specific query.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Post-trade compliance (state YU05): settlement T+N sweep (SettlementService reads/advances
# whichever process wrote the row - order-matcher's Projector in the live default config, or this
# service's own TradeService.bookTrade if output.legacy-trades.enabled is ever turned on) +
# reconciliation against order-matcher's trade blotter.
settlement.t-plus-days=${SETTLEMENT_T_PLUS_DAYS:1}
settlement.sweep.interval-ms=${SETTLEMENT_SWEEP_INTERVAL_MS:5000}
recon.poll.interval-ms=${RECON_POLL_INTERVAL_MS:10000}
order-matcher.base-url=${ORDER_MATCHER_BASE_URL:http://order-matcher:18110}

# Post-trade compliance (state YU05, ADR-024): TCA benchmark price history.
tca.price-history.capacity-per-ticker=${TCA_PRICE_HISTORY_CAPACITY_PER_TICKER:10000}
tca.window-minutes=${TCA_WINDOW_MINUTES:5}

# Post-trade compliance (state YU05, ADR-025, FR-PTC40): shared HS256 JWT secret. MUST match
# order-matcher's auth.jwt.secret exactly. auth.dev-token.master-secret gates POST /auth/dev-token
# (local dev/test token minting only — see JwtTokenMinter).
auth.jwt.secret=${AUTH_JWT_SECRET:dev-jwt-shared-secret}
auth.dev-token.master-secret=${AUTH_DEV_TOKEN_MASTER_SECRET:dev-token-master-secret}

# EOD price production (state YU06, ADR-026/027): closing price = last-trade sample from the YU05
# PriceHistoryStore; quality thresholds; the durable EOD_PRICES_READY gate event. eod.universe
# empty => price every ticker the feed has seen this session (a listed-but-unseen ticker is MISSING).
# eod.event.enabled=false disables the JetStream publish (tests) without touching the DB path.
eod.quality.staleness-seconds=${EOD_STALENESS_SECONDS:300}
eod.quality.max-move-pct=${EOD_MAX_MOVE_PCT:20}
eod.universe=${EOD_UNIVERSE:}
eod.session.auto-publish=${EOD_AUTO_PUBLISH:true}
eod.stream=${EOD_STREAM:TRADERX_EOD}
eod.subject.prices-ready=${EOD_SUBJECT_PRICES_READY:eod.prices.ready}
eod.event.enabled=${EOD_EVENT_ENABLED:true}

# --- YU16 (FR-CDM24): booking-time Treasury metadata, resolved before the transaction with
# --- bounded timeouts; the fixed clock makes maturity behavior testable (NFR-CDM09).
reference.data.service.url=${REFERENCE_DATA_SERVICE_URL:http://reference-data:18085}
reference.data.connect.timeout.ms=${REFERENCE_DATA_CONNECT_TIMEOUT_MS:2000}
reference.data.read.timeout.ms=${REFERENCE_DATA_READ_TIMEOUT_MS:5000}
traderx.fixed-utc-instant=${TRADERX_FIXED_UTC_INSTANT:}
