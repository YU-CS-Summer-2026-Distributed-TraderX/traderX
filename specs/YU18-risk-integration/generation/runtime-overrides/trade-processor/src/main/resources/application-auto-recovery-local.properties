# DISPOSABLE LOCAL TEST PROFILE ONLY (RI06 automatic projection recovery). Activate with
# --spring.profiles.active=auto-recovery-local. Retained and GKE profiles never enable this.
# Requires ri06-automatic-recovery.sql applied and loopback gateway origins in AUTO_RECOVERY_ENDPOINTS.
projection.auto-recovery.enabled=true
projection.auto-recovery.endpoints=${AUTO_RECOVERY_ENDPOINTS}
projection.auto-recovery.interval-ms=${AUTO_RECOVERY_INTERVAL_MS:2000}
projection.auto-recovery.lease-ttl-ms=${AUTO_RECOVERY_LEASE_TTL_MS:5000}
projection.auto-recovery.max-backoff-ms=${AUTO_RECOVERY_MAX_BACKOFF_MS:10000}
projection.auto-recovery.page-events=${AUTO_RECOVERY_PAGE_EVENTS:50}
