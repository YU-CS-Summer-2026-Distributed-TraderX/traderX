# YU18 copy of YU02's nats-configmap.yaml (shadows it from YU18): adds the JetStream ingest queue.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: traderx
data:
  nats.conf: |
    port: 4222
    http: 8222

    websocket {
      port: 8081
      no_tls: true
    }

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 512MB
      # 2026-11-06 (FR-THT-01): the trade feed is JetStream-only, so trade-processor creates TRADERX_FEED at its 20 GiB
      # limit (trade-processor-deployment.yaml) on every tier. At 4GB that was refused ("insufficient storage resources
      # available (10047)", nats 2.14, measured); 24GB matches cluster/gke/nats.yaml. A ceiling reserves no disk: the
      # store holds what was written (36K for an empty 20 GiB stream, measured), and the 2 h age limit bounds it.
      max_file_store: 24GB
      # YU18 (downstream-at-400k.md §7.8): the bridges core-publish, and NATS silently DROPS what overflows a
      # stream's ingest queue ("IPQ len limit reached"). Sized under nats-broker's 1Gi memory limit.
      max_buffered_msgs: 1000000
      max_buffered_size: 512MB
    }
