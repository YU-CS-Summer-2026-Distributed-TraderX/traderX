apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-processor
  namespace: traderx
  labels:
    app: trade-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-processor
  template:
    metadata:
      labels:
        app: trade-processor
    spec:
      containers:
        - name: trade-processor
          image: traderx/trade-processor:state009
          imagePullPolicy: IfNotPresent
          # Guaranteed floor so the projector isn't BestEffort/starvable under load (was no resources).
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          ports:
            - name: http
              containerPort: 18091
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
            - name: TRADE_PROCESSOR_SERVICE_PORT
              value: "18091"
            - name: DATABASE_PG_HOST
              value: "database"
            - name: DATABASE_PG_PORT
              value: "3306"
            - name: DATABASE_NAME
              value: "traderx"
            - name: DATABASE_DBUSER
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: username
            - name: DATABASE_DBPASS
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: password
            # Post-trade compliance (YU05) shared HS256 secret + dev-token minting secret — sourced
            # from the auth-secrets Secret (created out-of-band, never committed) instead of the
            # code's dev-defaults. AUTH_JWT_SECRET MUST match order-matcher's copy exactly (same key).
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-secret
            - name: AUTH_DEV_TOKEN_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: dev-token-master-secret
            - name: NATS_BROKER_HOST
              value: "nats-broker"
            # YU18: back to YU05's 10 s. It was backed off to daily (YU12) while no blotter surface
            # existed; the cluster gateway now forwards /recon/* to a member's committed-log blotter
            # (as YU17's cluster tier already says), and with TRADE_PROJECTION_MODE=snapshot the sweep
            # classifies against the capture stream, not the SQL trades window (§7.6).
            - name: RECON_POLL_INTERVAL_MS
              value: "10000"
            # YU18 trade store retention (docs/engineering/downstream-at-400k.md §7.7), applied to the
            # TRADERX_FEED stream when PROJECTION_FEED_MODE=jetstream (an existing stream is updated):
            #   462 B/trade side + 588 B/order update (stored, measured) x 10K + 10K msgs/s (this tier's
            #   sized peak) = 10.5 MB/s; x 30 min (the longest outage replayed from) = 18.9 GB -> 20 GiB.
            # Age bounds a quiet stream; the projection refuses to start (RETENTION_GAP) rather than skip
            # anything a limit discarded. NATS's max_file_store/PVC (cluster/gke/nats.yaml) exceed these.
            - name: PROJECTION_FEED_STREAM_MAX_BYTES
              value: "21474836480"
            - name: PROJECTION_FEED_STREAM_MAX_AGE_HOURS
              value: "2"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:8080,http://127.0.0.1:8080"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,prometheus,info"
            - name: MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
