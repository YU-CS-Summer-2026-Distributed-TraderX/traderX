apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-matcher-aeron-peer
  namespace: traderx
spec:
  podSelector:
    matchLabels:
      app: order-matcher
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-matcher
      ports:
        - {protocol: UDP, port: 40123}
        - {protocol: UDP, port: 40124}
        - {protocol: UDP, port: 40125}
        - {protocol: UDP, port: 40126}
        - {protocol: UDP, port: 40128}
        - {protocol: UDP, port: 40127}
        - {protocol: UDP, port: 8010}
        - {protocol: UDP, port: 8011}
        - {protocol: UDP, port: 8012}
    - ports:
        - {protocol: TCP, port: 18110}
        - {protocol: TCP, port: 18130}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: order-matcher
      ports:
        - {protocol: UDP, port: 40123}
        - {protocol: UDP, port: 40124}
        - {protocol: UDP, port: 40125}
        - {protocol: UDP, port: 40126}
        - {protocol: UDP, port: 40128}
        - {protocol: UDP, port: 40127}
        - {protocol: UDP, port: 8010}
        - {protocol: UDP, port: 8011}
        - {protocol: UDP, port: 8012}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 4222}
        - {protocol: TCP, port: 3306}
        - {protocol: TCP, port: 18085}
        - {protocol: TCP, port: 18088}
        - {protocol: TCP, port: 18090}
        - {protocol: TCP, port: 18092}
        - {protocol: TCP, port: 18100}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Kubernetes Lease calls terminate at the API Service endpoint, which is not represented by
    # a namespace-selected pod on kind (and may likewise be externally hosted on managed GKE).
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
