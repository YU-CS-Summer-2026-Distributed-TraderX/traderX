apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-matcher
  namespace: traderx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: order-matcher-leader
  namespace: traderx
rules:
- apiGroups:
  - coordination.k8s.io
  resourceNames:
  - order-matcher-leader
  resources:
  - leases
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - list
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: order-matcher-leader
  namespace: traderx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: order-matcher-leader
subjects:
- kind: ServiceAccount
  name: order-matcher
  namespace: traderx
