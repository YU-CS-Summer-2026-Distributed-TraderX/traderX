# Production template. Supply secrets/certificates through the deployment secret store and mount
# /data/jetstream on an encrypted volume. The process refuses production startup unless the
# deployment marks that volume as protected.
port: 4222
http_port: 8222

tls {
  cert_file: "/run/secrets/nats_server_cert"
  key_file: "/run/secrets/nats_server_key"
  ca_file: "/run/secrets/nats_ca_cert"
  verify: true
}

authorization {
  users: [
    { user: $NATS_RUNTIME_USER, password: $NATS_RUNTIME_PASSWORD,
      permissions: { publish: { allow: [">"] , deny: ["traderx.control.>"] },
                     subscribe: { allow: [">"] , deny: ["traderx.control.>"] } } },
    { user: $NATS_CONTROL_SOURCE_USER, password: $NATS_CONTROL_SOURCE_PASSWORD,
      permissions: { publish: ["traderx.control.>"], subscribe: ["_INBOX.>"] } },
    { user: $NATS_MATCHER_USER, password: $NATS_MATCHER_PASSWORD,
      permissions: { publish: { allow: [">"] , deny: ["traderx.control.>"] }, subscribe: [">"] } }
  ]
}

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 10GB
}
