server.port=${ORDER_MATCHER_PORT:18110}

spring.datasource.url=jdbc:postgresql://${DATABASE_PG_HOST:localhost}:${DATABASE_PG_PORT:5432}/${DATABASE_NAME:traderx}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_DBUSER:traderx}
spring.datasource.password=${DATABASE_DBPASS:traderx}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.threads.virtual.enabled=true

order.matcher.price-service-url=${PRICE_SERVICE_URL:http://${PRICE_SERVICE_HOST:localhost}:18100}
order.matcher.trade-service-url=${TRADE_SERVICE_URL:http://${TRADE_SERVICE_HOST:localhost}:18092/trade/}
order.matcher.fill-full-threshold=${ORDER_FILL_FULL_THRESHOLD:1000}
order.matcher.seed-enabled=${ORDER_MATCHER_SEED_ENABLED:true}
nats.address=${NATS_ADDRESS:nats://${NATS_BROKER_HOST:localhost}:4222}

# LMAX hot path (state 009b). The 009 polling tick (order.matcher.tick-ms) is removed:
# matching is event-driven off the sequenced input ring (FR-09B02).
runtime.profile=${RUNTIME_PROFILE:demo}
disruptor.input.ring-size=${DISRUPTOR_INPUT_RING_SIZE:65536}
disruptor.input.wait-strategy=${DISRUPTOR_INPUT_WAIT_STRATEGY:blocking}
disruptor.output.ring-size=${DISRUPTOR_OUTPUT_RING_SIZE:65536}
disruptor.output.wait-strategy=${DISRUPTOR_OUTPUT_WAIT_STRATEGY:blocking}
journal.enabled=${ORDER_MATCHER_JOURNAL_ENABLED:true}
journal.path=${ORDER_MATCHER_JOURNAL_PATH:./data/journal}
output.legacy-trades.enabled=${OUTPUT_LEGACY_TRADES_ENABLED:false}
output.projector.batch-size=${OUTPUT_PROJECTOR_BATCH_SIZE:500}
blp.books.max-securities=${BLP_MAX_SECURITIES:4096}
blp.book.pool-size=${BLP_BOOK_POOL_SIZE:65536}
blp.gateway.ack-timeout-ms=${BLP_GATEWAY_ACK_TIMEOUT_MS:5000}

# In-memory risk Gateway: bounded bootstrap and authoritative BLP limits.
risk.seed.accounts=${RISK_SEED_ACCOUNTS:22214,44044,52355,10031,62654}
risk.seed.securities=${RISK_SEED_SECURITIES:IBM,MSFT,JPM,GS,NVDA,C,META,MS,UBS,DB,COF,DFS,FIS,FNF,PARITYA,PARITYB,PARITYC,PARITYD,POSBUY,POSSELL,POSMKT}
risk.max-accounts=${RISK_MAX_ACCOUNTS:4096}
risk.max-entitlements=${RISK_MAX_ENTITLEMENTS:65536}
risk.max-order-quantity=${RISK_MAX_ORDER_QUANTITY:1000000}
risk.max-order-notional-ticks=${RISK_MAX_ORDER_NOTIONAL_TICKS:1000000000000000}
risk.max-position-quantity=${RISK_MAX_POSITION_QUANTITY:1000000}
risk.max-concentration-notional-ticks=${RISK_MAX_CONCENTRATION_NOTIONAL_TICKS:5000000000000000}
risk.credit-limit-ticks=${RISK_CREDIT_LIMIT_TICKS:5000000000000000}
risk.price.max-age-ms=${RISK_PRICE_MAX_AGE_MS:30000}
risk.price.collar-bps=${RISK_PRICE_COLLAR_BPS:5000}
risk.idempotency.capacity=${RISK_IDEMPOTENCY_CAPACITY:65536}
risk.snapshot.enabled=${RISK_SNAPSHOT_ENABLED:true}
risk.snapshot.path=${RISK_SNAPSHOT_PATH:./data/risk/blp-risk.snapshot}
risk.order-expiry-ms=${RISK_ORDER_EXPIRY_MS:300000}
risk.control.token=${RISK_CONTROL_TOKEN:dev-risk-control}
risk.control-stream.enabled=${RISK_CONTROL_STREAM_ENABLED:false}
risk.control.stale-after-ms=${RISK_CONTROL_STALE_AFTER_MS:30000}
risk.data-at-rest-protected=${RISK_DATA_AT_REST_PROTECTED:false}
risk.account-snapshot-url=${RISK_ACCOUNT_SNAPSHOT_URL:http://localhost:18088/account/control/snapshot}
risk.security-snapshot-url=${RISK_SECURITY_SNAPSHOT_URL:http://localhost:18085/stocks/control/snapshot}
risk.policy-snapshot-url=${RISK_POLICY_SNAPSHOT_URL:http://localhost:18088/risk-admin/control/snapshot}
risk.replica.bootstrap.timeout-ms=${RISK_REPLICA_BOOTSTRAP_TIMEOUT_MS:30000}

# To avoid "Request header is too large" when application is backed by oidc proxy.
server.max-http-request-header-size=1000000

logging.level.root=info
