plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.14'
  id 'io.spring.dependency-management' version '1.1.7'
}

ext['tomcat.version'] = '10.1.55'

group = 'finos.traderx.order-matcher-specfirst'
version = '0.1.0'

java {
  sourceCompatibility = JavaVersion.VERSION_21
}

// In-place development of this overlay (specs/.../runtime-overrides): the
// parent-state (009) sources live in .parent-src so the module compiles and
// the IDE resolves imports without generating. Generated trees merge the
// parent files directly into src/ and have no .parent-src; Gradle ignores
// missing source dirs, so this is a no-op there.
sourceSets {
  main {
    java {
      srcDir '.parent-src/main/java'
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
  runtimeOnly 'org.postgresql:postgresql:42.7.11'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'
  implementation('org.json:json:20240303') {
    because 'previous versions are affected by multiple CVE'
  }
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.20'
  implementation('io.socket:socket.io-client:2.1.2') {
    exclude group: 'org.json', module: 'json'
  }
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation ('ch.qos.logback:logback-core:1.5.32') {
    because 'version brought in by spring boot 3.5.14 affected by CVE-2024-12798'
  }
  implementation 'ch.qos.logback:logback-classic:1.5.32'
  implementation 'org.apache.logging.log4j:log4j-api:2.25.4'
  implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.25.4'
  implementation 'org.apache.commons:commons-lang3:3.20.0'
  implementation 'io.nats:jnats:2.20.5'

  // LMAX hot path (state 009b): ring buffers + latency histograms.
  implementation 'com.lmax:disruptor:4.0.0'
  implementation 'org.hdrhistogram:HdrHistogram:2.2.2'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'com.h2database:h2'
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
  systemProperty 'allocationAttribution', System.getProperty('allocationAttribution', 'false')
}

tasks.named('test') {
  // The inherited allocation suites preallocate large caches; the additional Spring risk
  // context otherwise leaves the default 512 MiB worker short of heap in the aggregate run.
  maxHeapSize = '1g'
}

// No-GC allocation gate (NGC-02, SC-09B05, task T09B18): re-run the hot-path allocation
// gate under Epsilon GC — a no-op collector on a small fixed pre-touched heap, so any
// steady-state allocation exhausts the heap and fails the run. The same test also runs
// in the regular `test` task under the default collector, where it asserts exact
// zero-byte deltas per hot-path thread via ThreadMXBean. Invoked by
// pipeline/validate-no-gc-conformance.sh (SC-NGC-01).
tasks.register('noGcTest', Test) {
  description = 'Hot-path allocation gate under Epsilon GC (zero steady-state allocation, NGC-02).'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching 'finos.traderx.ordermatcher.lmax.AllocationGateTest'
    includeTestsMatching 'finos.traderx.ordermatcher.lmax.OutputHandlerAllocationGateTest'
    includeTestsMatching 'finos.traderx.ordermatcher.risk.RiskAllocationGateTest'
  }
  systemProperty 'gate.steadyStateEvents', System.getProperty('gate.steadyStateEvents', '3000000')
  jvmArgs '-XX:+UnlockExperimentalVMOptions', '-XX:+UseEpsilonGC',
          '-Xms512m', '-Xmx512m', '-XX:+AlwaysPreTouch'
}

tasks.register('outputLatencyBenchmark', Test) {
  description = 'Local output-handler latency microbenchmark for ODL-01/ODL-05.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching 'finos.traderx.ordermatcher.lmax.OutputHandlerLatencyBenchmarkTest'
    includeTestsMatching 'finos.traderx.ordermatcher.lmax.LmaxEndToEndLatencyBenchmarkTest'
  }
  systemProperty 'outputLatencyBenchmark', 'true'
  systemProperty 'outputLatencyBenchmark.iterations', System.getProperty('outputLatencyBenchmark.iterations', '200000')
  systemProperty 'endToEndLatencyBenchmark.iterations', System.getProperty('endToEndLatencyBenchmark.iterations', '1000')
  jvmArgs '-Xms512m', '-Xmx512m'
  testLogging {
    showStandardStreams = true
  }
}

tasks.register('outputTopologyBenchmark', Test) {
  description = 'Compare direct output-ring consumers with the synchronized external-edge worker.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching 'finos.traderx.ordermatcher.lmax.OutputTopologyBenchmarkTest'
  }
  systemProperty 'outputTopologyBenchmark', 'true'
  systemProperty 'outputTopologyBenchmark.fastEvents',
      System.getProperty('outputTopologyBenchmark.fastEvents', '50000')
  systemProperty 'outputTopologyBenchmark.delayedEvents',
      System.getProperty('outputTopologyBenchmark.delayedEvents', '5000')
  systemProperty 'outputTopologyBenchmark.stalledEvents',
      System.getProperty('outputTopologyBenchmark.stalledEvents', '5000')
  systemProperty 'outputTopologyBenchmark.ringSize',
      System.getProperty('outputTopologyBenchmark.ringSize', '1024')
  jvmArgs '-Xms512m', '-Xmx512m'
  testLogging {
    showStandardStreams = true
  }
}

tasks.register('riskLatencyBenchmark', Test) {
  description = 'Gateway screening and authoritative BLP risk-decision latency benchmark.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter { includeTestsMatching 'finos.traderx.ordermatcher.risk.RiskLatencyBenchmarkTest' }
  systemProperty 'riskLatencyBenchmark', 'true'
  systemProperty 'riskLatencyBenchmark.iterations',
      System.getProperty('riskLatencyBenchmark.iterations', '20000')
  jvmArgs '-Xms512m', '-Xmx512m'
  testLogging { showStandardStreams = true }
}

configurations.configureEach {
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
