apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-processor
  namespace: traderx
  labels:
    app: trade-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-processor
  template:
    metadata:
      labels:
        app: trade-processor
    spec:
      containers:
        - name: trade-processor
          image: traderx/trade-processor:state009
          imagePullPolicy: IfNotPresent
          # Guaranteed floor so the projector isn't BestEffort/starvable under load (was no resources).
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          ports:
            - name: http
              containerPort: 18091
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: TRADE_PROCESSOR_SERVICE_PORT
              value: "18091"
            - name: DATABASE_PG_HOST
              value: "database"
            - name: DATABASE_PG_PORT
              value: "3306"
            - name: DATABASE_NAME
              value: "traderx"
            - name: DATABASE_DBUSER
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: username
            - name: DATABASE_DBPASS
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: password
            # Post-trade compliance (YU05) shared HS256 secret + dev-token minting secret — sourced
            # from the auth-secrets Secret (created out-of-band, never committed) instead of the
            # code's dev-defaults. AUTH_JWT_SECRET MUST match order-matcher's copy exactly (same key).
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-secret
            - name: AUTH_DEV_TOKEN_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: dev-token-master-secret
            - name: NATS_BROKER_HOST
              value: "nats-broker"
            # YU12: the reconciliation sweep's blotter endpoints live on the old order-matcher,
            # which has no endpoints in this state — every 10s sweep was a ConnectException.
            # Back it off to daily until the cluster gateway exposes a blotter surface
            # (binds recon.poll.interval-ms via Spring relaxed env binding).
            - name: RECON_POLL_INTERVAL_MS
              value: "86400000"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:8080,http://127.0.0.1:8080"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,prometheus,info"
            - name: MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
