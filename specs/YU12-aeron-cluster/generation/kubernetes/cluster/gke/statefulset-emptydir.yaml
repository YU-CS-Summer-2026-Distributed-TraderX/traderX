apiVersion: v1
kind: Service
metadata:
  name: order-matcher-cluster
  labels:
    app: order-matcher-cluster
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: order-matcher-cluster
  ports:
    - name: health
      port: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-matcher-cluster
spec:
  serviceName: order-matcher-cluster
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: order-matcher-cluster
  template:
    metadata:
      labels:
        app: order-matcher-cluster
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: blp-c3-pool
      tolerations:
        - key: workload
          operator: Equal
          value: blp
          effect: NoSchedule
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          # required now that the pool guarantees one node per member (3x c3-standard-4):
          # a node fault can take at most ONE member (true node-fault tolerance, joint plan Ph2)
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: order-matcher-cluster
              topologyKey: kubernetes.io/hostname
      initContainers:
        # DR restore: when RESTORE_FROM_GCS=1, member-0 seeds its (emptyDir) /data from the
        # latest GCS backup before the JVM starts; members 1 & 2 come up empty and rejoin member-0
        # via the proven catch-up. No-op on normal boot. Uses the journal-archive HMAC creds.
        - name: restore-from-gcs
          image: google/cloud-sdk:latest
          env:
            - name: RESTORE_FROM_GCS
              value: "0"
            - name: GS_ID
              valueFrom: { secretKeyRef: { name: order-matcher-journal-gcs-hmac, key: access-key-id } }
            - name: GS_SECRET
              valueFrom: { secretKeyRef: { name: order-matcher-journal-gcs-hmac, key: secret-access-key } }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              ORD="${HOSTNAME##*-}"
              [ "${RESTORE_FROM_GCS:-0}" = "1" ] || { echo "restore disabled — normal boot"; exit 0; }
              [ "$ORD" = "0" ] || { echo "member $ORD rejoins fresh (only member-0 restores)"; exit 0; }
              [ -s /data/cluster/recording.log ] && { echo "/data already populated — skip restore"; exit 0; }
              echo "restoring member-0 /data from GCS latest.tgz ..."
              export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
              python3 -m pip install --break-system-packages --quiet boto3 >/dev/null 2>&1
              python3 -c "import boto3; from botocore.config import Config; boto3.client('s3',endpoint_url='https://storage.googleapis.com',aws_access_key_id='$GS_ID',aws_secret_access_key='$GS_SECRET',config=Config(signature_version='s3v4',s3={'addressing_style':'path'})).download_file('traderx-501015-order-matcher-journal-archive','yu12-cluster-snapshots/latest.tgz','/tmp/latest.tgz')"
              mkdir -p /data && tar -xzSf /tmp/latest.tgz -C /data
              echo "restored member-0: $(ls /data)"
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: cluster-node
          image: us-east1-docker.pkg.dev/traderx-501015/traderx/cluster-node:yu12
          imagePullPolicy: Always
          # sh wrapper keeps the JVM off PID 1 so a crash harness can SIGKILL it from a
          # kubectl exec (Linux blocks signals to PID 1 from inside the namespace) — a true
          # crash with a node-clock timestamp, no pod-delete API latency in the measurement.
          command: ["/bin/sh", "-c", "java -cp /opt/app/classes:/opt/app/lib/* finos.traderx.ordermatcher.cluster.ClusterNodeMain & wait $!"]
          env:
            - name: CLUSTER_HOSTNAMES
              value: "order-matcher-cluster-0.order-matcher-cluster.traderx.svc.cluster.local,order-matcher-cluster-1.order-matcher-cluster.traderx.svc.cluster.local,order-matcher-cluster-2.order-matcher-cluster.traderx.svc.cluster.local"
            - name: CLUSTER_PORT_BASE
              value: "21800"
            - name: CLUSTER_HEARTBEAT_INTERVAL_MS
              value: "50"
            - name: CLUSTER_HEARTBEAT_TIMEOUT_MS
              value: "200"
            - name: CLUSTER_ELECTION_TIMEOUT_MS
              value: "100"
            - name: CLUSTER_ELECTION_STATUS_INTERVAL_MS
              value: "25"
            - name: CLUSTER_BASE_DIR
              value: "/data"
            - name: CLUSTER_AERON_DIR
              value: "/dev/shm/aeron-cluster"
            - name: CLUSTER_OUTPUT_RING_SIZE
              value: "262144"
            - name: CLUSTER_SNAPSHOT_INTERVAL_MS
              value: "60000"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          # Guaranteed QoS (joint plan Phase 2): request==limit so the consensus/driver duty
          # cycle never rides CFS burst credit; 3 CPU leaves ~0.9 for daemonsets on c3-standard-4.
          resources:
            requests:
              cpu: "3"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: data
          emptyDir:
            sizeLimit: 2Gi
