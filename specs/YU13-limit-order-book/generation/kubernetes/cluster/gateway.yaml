apiVersion: v1
kind: Service
metadata:
  name: order-matcher
  labels:
    app: cluster-gateway
spec:
  selector:
    app: cluster-gateway
  ports:
    - name: http
      port: 18110
      targetPort: 18110
    - name: fix
      port: 18130
      targetPort: 18130
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-gateway
  template:
    metadata:
      labels:
        app: cluster-gateway
    spec:
      containers:
        - name: gateway
          image: traderx/cluster-node:yu13
          imagePullPolicy: IfNotPresent
          command:
            - java
            - -cp
            - /opt/app/classes:/opt/app/lib/*
            - finos.traderx.ordermatcher.cluster.ClusterGatewayMain
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GATEWAY_INGRESS_ENDPOINTS
              value: "0=order-matcher-cluster-0.order-matcher-cluster.traderx.svc.cluster.local:21802,1=order-matcher-cluster-1.order-matcher-cluster.traderx.svc.cluster.local:21902,2=order-matcher-cluster-2.order-matcher-cluster.traderx.svc.cluster.local:22002"
            - name: GATEWAY_HTTP_PORT
              value: "18110"
            - name: GATEWAY_EGRESS_PORT
              value: "40470"
            - name: FIX_ACCEPTOR_PORT
              value: "18130"
            - name: FIX_SESSION_COMPIDS
              value: "CLIENT1"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dsun.net.httpserver.nodelay=true -Xms192m -Xmx384m --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          ports:
            - name: http
              containerPort: 18110
            - name: fix
              containerPort: 18130
          readinessProbe:
            httpGet:
              path: /ready
              port: 18110
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 200m
              memory: 448Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
