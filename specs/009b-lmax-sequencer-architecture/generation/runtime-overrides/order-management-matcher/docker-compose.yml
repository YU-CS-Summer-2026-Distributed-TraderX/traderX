name: traderx-state-009

services:
  database:
    image: mariadb:11.4
    # lower_case_table_names=1: services reference tables in mixed/conflicting case
    # (Accounts, Trades, OrderBook, and @Table("TRADES") vs "select ... from Trades").
    # Postgres folded unquoted identifiers to lowercase; MariaDB on Linux is case-sensitive,
    # so make table-name resolution case-insensitive to keep every consumer on one table.
    command: ["--lower-case-table-names=1", "--innodb-flush-log-at-trx-commit=2"]
    environment:
      MARIADB_DATABASE: "traderx"
      MARIADB_USER: "traderx"
      MARIADB_PASSWORD: "traderx"
      MARIADB_ROOT_PASSWORD: "traderx"
    ports:
      - "18083:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -utraderx -ptraderx --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb_state_009_data:/var/lib/mysql
      - ../postgres-database-replacement/mariadb-init/initialSchema.sql:/docker-entrypoint-initdb.d/001-initialSchema.sql:ro

  reference-data:
    build:
      context: ../reference-data
      dockerfile: Dockerfile.compose
    environment:
      REFERENCE_DATA_SERVICE_PORT: "18085"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,info"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      REFERENCE_DATA_SUPPORTED_TICKERS: "${SUPPORTED_TICKERS:-AAPL,MSFT,AMZN,GOOGL,META,NVDA,TSLA,IBM,BAC,C,JPM,GS,MS,UBS,DB,COF,DFS,FNMA,FIS,FNF}"
    ports:
      - "18085:18085"
    depends_on:
      - database

  nats-broker:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"
      - "8222:8222"
      - "8081:8081"

  price-publisher:
    build:
      context: ../price-publisher
      dockerfile: Dockerfile.compose
    environment:
      PRICE_PUBLISHER_PORT: "18100"
      NATS_BROKER_HOST: "nats-broker"
      PRICE_BOOTSTRAP_MODE: "${PRICE_BOOTSTRAP_MODE:-snapshot}"
      PRICE_TICKERS: "${SUPPORTED_TICKERS:-AAPL,MSFT,AMZN,GOOGL,META,NVDA,TSLA,IBM,BAC,C,JPM,GS,MS,UBS,DB,COF,DFS,FNMA,FIS,FNF}"
    ports:
      - "18100:18100"
    depends_on:
      - nats-broker

  people-service:
    build:
      context: ../people-service
      dockerfile: Dockerfile.compose
    environment:
      PEOPLE_SERVICE_PORT: "18089"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,info"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
    ports:
      - "18089:18089"

  account-service:
    build:
      context: ../account-service
      dockerfile: Dockerfile.compose
    environment:
      ACCOUNT_SERVICE_PORT: "18088"
      DATABASE_PG_HOST: "database"
      DATABASE_PG_PORT: "3306"
      DATABASE_NAME: "traderx"
      DATABASE_DBUSER: "traderx"
      DATABASE_DBPASS: "traderx"
      PEOPLE_SERVICE_HOST: "people-service"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,info"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
    ports:
      - "18088:18088"
    depends_on:
      database:
        condition: service_healthy
      people-service:
        condition: service_started

  position-service:
    build:
      context: ../position-service
      dockerfile: Dockerfile.compose
    environment:
      POSITION_SERVICE_PORT: "18090"
      DATABASE_PG_HOST: "database"
      DATABASE_PG_PORT: "3306"
      DATABASE_NAME: "traderx"
      DATABASE_DBUSER: "traderx"
      DATABASE_DBPASS: "traderx"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,info"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
    ports:
      - "18090:18090"
    depends_on:
      database:
        condition: service_healthy

  trade-processor:
    build:
      context: ../trade-processor
      dockerfile: Dockerfile.compose
    environment:
      TRADE_PROCESSOR_SERVICE_PORT: "18091"
      DATABASE_PG_HOST: "database"
      DATABASE_PG_PORT: "3306"
      DATABASE_NAME: "traderx"
      DATABASE_DBUSER: "traderx"
      DATABASE_DBPASS: "traderx"
      NATS_BROKER_HOST: "nats-broker"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,info"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
    ports:
      - "18091:18091"
    depends_on:
      database:
        condition: service_healthy
      nats-broker:
        condition: service_started

  trade-service:
    build:
      context: ../trade-service
      dockerfile: Dockerfile.compose
    environment:
      TRADING_SERVICE_PORT: "18092"
      ACCOUNT_SERVICE_HOST: "account-service"
      REFERENCE_DATA_HOST: "reference-data"
      PEOPLE_SERVICE_HOST: "people-service"
      NATS_BROKER_HOST: "nats-broker"
      PRICE_SERVICE_HOST: "price-publisher"
      # Order routing goes through the matcher VIP so a failover is transparent to trading.
      ORDER_MATCHER_URL: "http://order-matcher-vip:18110"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,info"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
    ports:
      - "18092:18092"
    depends_on:
      - account-service
      - reference-data
      - people-service
      - nats-broker
      - price-publisher
      - trade-processor

  web-front-end-angular:
    build:
      context: ../web-front-end/angular
      dockerfile: Dockerfile.compose
    environment:
      WEB_SERVICE_PORT: "18093"
    ports:
      - "18093:18093"
    depends_on:
      - account-service
      - reference-data
      - trade-service
      - position-service
      - people-service
      - nats-broker

  order-matcher:
    build:
      context: ../order-matcher
      dockerfile: Dockerfile.compose
    # Perf profile: pin the BLP to a core (BLP_PIN_CPU) + busy-spin the input ring. Deliberately NO
    # cpuset cap — the A/B showed capping the container's cores HURTS peak throughput (starves the
    # output ring / GC / JIT) far more than pinning helps; add `cpuset: "1-5"` only for hard isolation.
    # Demo/container-safe profile: BLP_PIN_CPU=-1 and DISRUPTOR_INPUT_WAIT_STRATEGY=blocking. Note
    # busy-spin pegs ~3 cores (journaler+replicator+BLP) continuously while the stack is up.
    environment:
      ORDER_MATCHER_PORT: "18110"
      # Failover pair (FR-09B30..B32): this node PREFERS leadership but the leader.lock on the
      # shared journal volume decides — restarted after a failover it rejoins as a follower,
      # watching the promoted node so auto-failover still works in the reverse direction.
      BLP_ROLE: "primary"
      FAILOVER_WATCH_URL: "http://order-matcher-standby:18110/health"
      BLP_PIN_CPU: "${BLP_PIN_CPU:-2}"
      DISRUPTOR_INPUT_WAIT_STRATEGY: "${DISRUPTOR_INPUT_WAIT_STRATEGY:-busyspin}"
      # Periodic full-state snapshot to bound journal replay (0 = off). Recovery loads snapshot.dat
      # and replays only the journal tail after it. Default ON: it bounds leader restart, standby
      # catch-up, AND stops the unbounded-journal OOM a long bench run used to leave behind.
      SNAPSHOT_INTERVAL_MS: "${SNAPSHOT_INTERVAL_MS:-30000}"
      # Bounded terminal-order retention (GC limiter fix): keep identical on primary + standby.
      BLP_ORDERS_MAX_RETAINED: "${BLP_ORDERS_MAX_RETAINED:-262144}"
      # Cutover: recovery.source=journal makes snapshot+journal authoritative (no DB warm-start);
      # output.projector.db.enabled=false stops all DB writes. Together the matcher needs no database.
      RECOVERY_SOURCE: "${RECOVERY_SOURCE:-db}"
      OUTPUT_PROJECTOR_DB_ENABLED: "${OUTPUT_PROJECTOR_DB_ENABLED:-true}"
      # No-DB boot knobs (set together with the two above to run with the database fully stopped).
      SPRING_JPA_DDL_AUTO: "${SPRING_JPA_DDL_AUTO:-update}"
      HIKARI_INIT_FAIL_TIMEOUT: "${HIKARI_INIT_FAIL_TIMEOUT:-30000}"
      MANAGEMENT_HEALTH_DB_ENABLED: "${MANAGEMENT_HEALTH_DB_ENABLED:-true}"
      DATABASE_PG_HOST: "database"
      DATABASE_PG_PORT: "3306"
      DATABASE_NAME: "traderx"
      DATABASE_DBUSER: "traderx"
      DATABASE_DBPASS: "traderx"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,info"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      PRICE_SERVICE_URL: "http://price-publisher:18100"
      TRADE_SERVICE_URL: "http://trade-service:18092/trade/"
      NATS_BROKER_HOST: "nats-broker"
      ORDER_MATCHER_TICK_MS: "${ORDER_MATCHER_TICK_MS:-1000}"
      ORDER_FILL_FULL_THRESHOLD: "${ORDER_FILL_FULL_THRESHOLD:-1000}"
    ports:
      # The VIP owns host 18110 (the well-known matcher port); the primary is reachable
      # directly on 18111 for debugging and single-node benching.
      - "18111:18110"
    volumes:
      # Durable input journal (state 009b recovery): the BLP's source of truth must survive
      # container recreate, not just restart, so it can replace the DB as the durable store.
      # SHARED with order-matcher-standby: the journal doubles as the replication stream the
      # follower tails, and leader.lock on it is the split-brain fence.
      - order_matcher_journal:/opt/app/data
    depends_on:
      database:
        condition: service_healthy
      price-publisher:
        condition: service_started
      trade-service:
        condition: service_started
      nats-broker:
        condition: service_started

  # Warm standby BLP (FR-09B30..B32): boots as a FOLLOWER — recovers from snapshot+journal, then
  # tails the leader's journal continuously, so its book/positions/read-model track the leader
  # within milliseconds. Writes answer 503 and NATS output is gated until promotion; reads are
  # served warm the whole time. Its watchdog probes the primary's /health and promotes itself
  # (after winning leader.lock) when the primary process dies; the restarted primary then rejoins
  # as a follower. Follower-profile knobs: no core pinning / no busy-spin (the standby should be
  # nearly free until it is promoted) and no DB dependency at all (journal is authoritative).
  order-matcher-standby:
    build:
      context: ../order-matcher
      dockerfile: Dockerfile.compose
    environment:
      ORDER_MATCHER_PORT: "18110"
      BLP_ROLE: "standby"
      FAILOVER_WATCH_URL: "http://order-matcher:18110/health"
      FAILOVER_PROBE_INTERVAL_MS: "${FAILOVER_PROBE_INTERVAL_MS:-1000}"
      FAILOVER_PROBE_FAILURES: "${FAILOVER_PROBE_FAILURES:-3}"
      BLP_PIN_CPU: "-1"
      DISRUPTOR_INPUT_WAIT_STRATEGY: "blocking"
      SNAPSHOT_INTERVAL_MS: "${SNAPSHOT_INTERVAL_MS:-30000}"
      BLP_ORDERS_MAX_RETAINED: "${BLP_ORDERS_MAX_RETAINED:-262144}"
      RECOVERY_SOURCE: "journal"
      OUTPUT_PROJECTOR_DB_ENABLED: "false"
      SPRING_JPA_DDL_AUTO: "none"
      HIKARI_INIT_FAIL_TIMEOUT: "-1"
      MANAGEMENT_HEALTH_DB_ENABLED: "false"
      DATABASE_PG_HOST: "database"
      DATABASE_PG_PORT: "3306"
      DATABASE_NAME: "traderx"
      DATABASE_DBUSER: "traderx"
      DATABASE_DBPASS: "traderx"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,info"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      PRICE_SERVICE_URL: "http://price-publisher:18100"
      TRADE_SERVICE_URL: "http://trade-service:18092/trade/"
      NATS_BROKER_HOST: "nats-broker"
      ORDER_FILL_FULL_THRESHOLD: "${ORDER_FILL_FULL_THRESHOLD:-1000}"
    ports:
      - "18112:18110"
    volumes:
      - order_matcher_journal:/opt/app/data
    depends_on:
      order-matcher:
        condition: service_started
      nats-broker:
        condition: service_started

  # Stable VIP for the matcher pair: every client (trade-service, ingress, host port 18110)
  # addresses order-matcher-vip; haproxy routes commands to whichever node reports
  # /admin/ready=200 (the leader) and lets reads fall back to the warm follower while a
  # failover is in flight. Stats UI on http://localhost:18404/.
  order-matcher-vip:
    image: haproxy:2.9-alpine
    volumes:
      - ./failover/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "18110:18110"
      - "18404:8404"
    depends_on:
      order-matcher:
        condition: service_started
      order-matcher-standby:
        condition: service_started

  ingress:
    build:
      context: ../ingress
      dockerfile: Dockerfile.compose
    environment:
      NGINX_HOST: "${TRADERX_FQDN:-localhost}"
      DATABASE_URL: "http://database:3306/"
      REFERENCE_DATA_URL: "http://reference-data:18085/"
      PEOPLE_SERVICE_URL: "http://people-service:18089/"
      ACCOUNT_SERVICE_URL: "http://account-service:18088/"
      POSITION_SERVICE_URL: "http://position-service:18090/"
      TRADE_PROCESSOR_URL: "http://trade-processor:18091/"
      TRADE_SERVICE_URL: "http://trade-service:18092/"
      PRICE_PUBLISHER_URL: "http://price-publisher:18100/"
      ORDER_MATCHER_URL: "http://order-matcher-vip:18110/"
      WEB_FRONTEND_URL: "http://web-front-end-angular:18093/"
    ports:
      - "8080:8080"
    depends_on:
      - web-front-end-angular
      - account-service
      - reference-data
      - trade-service
      - position-service
      - people-service
      - nats-broker
      - price-publisher
      - order-matcher
      - order-matcher-vip

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
      - "13133:13133"
    depends_on:
      - tempo

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  prometheus:
    image: prom/prometheus:v2.53.2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - blackbox-exporter
      - otel-collector

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/config.yaml"]
    environment:
      DOCKER_API_VERSION: "${TRADERX_PROMTAIL_DOCKER_API_VERSION:-1.44}"
    volumes:
      - ./observability/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: "${TRADERX_GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${TRADERX_GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "${TRADERX_GRAFANA_ANONYMOUS_ENABLED:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "${TRADERX_GRAFANA_ANONYMOUS_ORG_ROLE:-Viewer}"
      GF_SERVER_ROOT_URL: "${TRADERX_GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "${TRADERX_GRAFANA_MIN_REFRESH:-1s}"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  mariadb_state_009_data:
  order_matcher_journal:
