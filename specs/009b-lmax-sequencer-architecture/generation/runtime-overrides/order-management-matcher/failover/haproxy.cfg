# Order-matcher VIP (state 009b warm standby, FR-09B30..B32).
#
# Holds the stable "order-matcher" address for every client (trade-service, ingress, host port
# 18110) in front of an active/passive matcher pair:
#
#   - COMMANDS (POST/PUT/PATCH/DELETE) only ever reach a node whose GET /admin/ready is 200 —
#     that is the LIVE node (the primary, or a standby that won the leader lock and promoted).
#     While no node is ready (the few seconds of a failover) commands get a clean 503, never a
#     silent write to a follower.
#   - READS prefer the live node, but when none is ready they fall back to any process that is
#     up: the warm follower serves /orders /positions /health from its tailed read model, so
#     read availability holds through the failover window (staleness bounded by follower lag).
#
# The docker resolver section makes haproxy re-resolve container IPs when a matcher is
# restarted (compose gives it a new IP; a static resolve would go stale).

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 2s
    timeout client 130s
    timeout server 130s
    retries 1

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold other 2s
    hold refused 2s
    hold nx 2s
    hold timeout 2s
    hold obsolete 2s

frontend matcher_vip
    bind *:18110
    acl is_write method POST PUT PATCH DELETE
    use_backend matcher_live if is_write
    use_backend matcher_live if { nbsrv(matcher_live) gt 0 }
    default_backend matcher_any

# The leader: /admin/ready is 200 only on the live node.
backend matcher_live
    option httpchk GET /admin/ready
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server primary order-matcher:18110 check
    server standby order-matcher-standby:18110 check backup

# Read fallback while no leader is ready: any matcher process that answers /health
# (the warm follower) — bounded-staleness reads instead of an outage.
backend matcher_any
    option httpchk GET /health
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server primary order-matcher:18110 check
    server standby order-matcher-standby:18110 check backup

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
