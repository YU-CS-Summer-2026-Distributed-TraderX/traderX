server.port=${ORDER_MATCHER_PORT:18110}

spring.datasource.url=jdbc:mariadb://${DATABASE_PG_HOST:localhost}:${DATABASE_PG_PORT:3306}/${DATABASE_NAME:traderx}?rewriteBatchedStatements=true
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${DATABASE_DBUSER:traderx}
spring.datasource.password=${DATABASE_DBPASS:traderx}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
# Option 1 — projector DB write path: batch the order/position JPA writes so N inserts/updates ride
# one JDBC round-trip instead of one each (rewriteBatchedStatements collapses them to multi-row INSERTs).
# (merge still does a per-row SELECT; that is the orders/positions tail option 3 would remove.)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.threads.virtual.enabled=true

order.matcher.price-service-url=${PRICE_SERVICE_URL:http://${PRICE_SERVICE_HOST:localhost}:18100}
order.matcher.trade-service-url=${TRADE_SERVICE_URL:http://${TRADE_SERVICE_HOST:localhost}:18092/trade/}
order.matcher.fill-full-threshold=${ORDER_FILL_FULL_THRESHOLD:1000}
order.matcher.seed-enabled=${ORDER_MATCHER_SEED_ENABLED:true}
nats.address=${NATS_ADDRESS:nats://${NATS_BROKER_HOST:localhost}:4222}

# LMAX hot path (state 009b). The 009 polling tick (order.matcher.tick-ms) is removed:
# matching is event-driven off the sequenced input ring (FR-09B02).
runtime.profile=${RUNTIME_PROFILE:demo}
disruptor.input.ring-size=${DISRUPTOR_INPUT_RING_SIZE:65536}
disruptor.input.wait-strategy=${DISRUPTOR_INPUT_WAIT_STRATEGY:blocking}
disruptor.output.ring-size=${DISRUPTOR_OUTPUT_RING_SIZE:65536}
disruptor.output.wait-strategy=${DISRUPTOR_OUTPUT_WAIT_STRATEGY:blocking}
journal.enabled=${ORDER_MATCHER_JOURNAL_ENABLED:true}
journal.path=${ORDER_MATCHER_JOURNAL_PATH:./data/journal}
output.legacy-trades.enabled=${OUTPUT_LEGACY_TRADES_ENABLED:false}
output.projector.batch-size=${OUTPUT_PROJECTOR_BATCH_SIZE:500}
output.projector.queue-capacity=${OUTPUT_PROJECTOR_QUEUE_CAPACITY:1000000}
blp.books.max-securities=${BLP_MAX_SECURITIES:4096}
blp.book.pool-size=${BLP_BOOK_POOL_SIZE:65536}
blp.gateway.ack-timeout-ms=${BLP_GATEWAY_ACK_TIMEOUT_MS:5000}

# To avoid "Request header is too large" when application is backed by oidc proxy.
server.max-http-request-header-size=1000000

logging.level.root=info
