apiVersion: apps/v1
kind: Deployment
metadata:
  name: tick-store
  namespace: traderx
  labels:
    app: tick-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tick-store
  template:
    metadata:
      labels:
        app: tick-store
    spec:
      containers:
        - name: tick-store
          image: traderx/tick-store:state-yu07
          imagePullPolicy: IfNotPresent
          env:
            - name: TICKSTORE_NATS_URL
              value: "nats://nats-broker:4222"
            - name: TICKSTORE_OUT_DIR
              value: "/data/ticks"
            - name: TICKSTORE_FLUSH_INTERVAL_SECONDS
              value: "30"
            - name: TICKSTORE_FLUSH_MAX_ROWS
              value: "5000"
          volumeMounts:
            - name: tick-store-data
              mountPath: /data/ticks
      volumes:
        - name: tick-store-data
          persistentVolumeClaim:
            claimName: tick-store-data
