apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-matcher
  namespace: traderx
  labels:
    app: order-matcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-matcher
  template:
    metadata:
      labels:
        app: order-matcher
    spec:
      containers:
        - name: order-matcher
          image: traderx/order-matcher:state009
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18110
              protocol: TCP
          env:
            - name: ORDER_MATCHER_PORT
              value: "18110"
            - name: DATABASE_PG_HOST
              value: "database"
            - name: DATABASE_PG_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "traderx"
            - name: DATABASE_DBUSER
              value: "traderx"
            - name: DATABASE_DBPASS
              value: "traderx"
            - name: NATS_BROKER_HOST
              value: "nats-broker"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:8080"
            - name: PRICE_SERVICE_URL
              value: "http://price-publisher:18100"
            - name: TRADE_SERVICE_URL
              value: "http://trade-service:18092/trade/"
            - name: ORDER_FILL_FULL_THRESHOLD
              value: "1000"
            - name: RUNTIME_PROFILE
              value: "demo"
            - name: DISRUPTOR_INPUT_RING_SIZE
              value: "65536"
            - name: DISRUPTOR_OUTPUT_RING_SIZE
              value: "65536"
            - name: ORDER_MATCHER_JOURNAL_ENABLED
              value: "true"
            - name: ORDER_MATCHER_JOURNAL_PATH
              value: "/var/lib/traderx-lmax/journal"
            - name: JOURNAL_REPLAY_VERIFY
              value: "true"
            - name: OUTPUT_LEGACY_TRADES_ENABLED
              value: "false"
            - name: OUTPUT_PROJECTOR_BATCH_SIZE
              value: "500"
            - name: OUTPUT_PROJECTOR_QUEUE_CAPACITY
              value: "1000000"
            - name: OUTPUT_PROJECTOR_DB_ENABLED
              value: "true"
            - name: BLP_MAX_SECURITIES
              value: "4096"
            - name: BLP_BOOK_POOL_SIZE
              value: "65536"
            - name: BLP_GATEWAY_ACK_TIMEOUT_MS
              value: "5000"
            - name: SNAPSHOT_INTERVAL_MS
              value: "300000"
            - name: RECOVERY_SOURCE
              value: "db"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,prometheus,info"
            - name: MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_READINESSSTATE_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: lmax-runtime-data
              mountPath: /var/lib/traderx-lmax
      volumes:
        - name: lmax-runtime-data
          persistentVolumeClaim:
            claimName: order-matcher-lmax-data
