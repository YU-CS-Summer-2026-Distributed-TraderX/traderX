# MariaDB for the local kind runtime. YU02's service code (order-matcher, account-service,
# trade-processor, position-service) all use the MariaDB JDBC driver (jdbc:mariadb://database:3306,
# MariaDBDialect) per quickstart.md, but the base kind database-deployment (inherited from state
# 010's overlay patch) still ran postgres:16-alpine on 5432 — so on kind no service could ever
# connect. This override brings the kind database in line with the service configs, mirroring the
# same fix later states (YU06) applied at their own layer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: traderx
  labels:
    app: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: mariadb:11.4
          args: ["--lower-case-table-names=1", "--innodb-flush-log-at-trx-commit=2"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: mariadb
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_DATABASE
              value: "traderx"
            - name: MARIADB_USER
              value: "traderx"
            - name: MARIADB_PASSWORD
              value: "traderx"
            - name: MARIADB_ROOT_PASSWORD
              value: "traderx"
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
            - name: database-init-sql
              mountPath: /docker-entrypoint-initdb.d/001-initialSchema.sql
              subPath: 001-initialSchema.sql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -utraderx -ptraderx --silent"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -utraderx -ptraderx --silent"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: db-data
          emptyDir: {}
        - name: database-init-sql
          configMap:
            name: database-init-sql
