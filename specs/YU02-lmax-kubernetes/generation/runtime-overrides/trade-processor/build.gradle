plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.7'
}

ext['jackson-bom.version'] = '2.22.1'
ext['tomcat.version'] = '10.1.57'

group = 'finos.traderx.trade-processor-specfirst'
version = '0.1.0'

java {
  sourceCompatibility = JavaVersion.VERSION_21
}

// Test sources for this project live at src/main/test/java (a pre-existing TraderX convention),
// which Gradle does not pick up by default — without this the inherited @SpringBootTest smoke
// test reports NO-SOURCE and silently never runs. Same fix brief 03 applied to the templates;
// this is the COMPOSED layer, which brief 03 deferred.
sourceSets {
  test {
    java.srcDirs = ["src/test/java", "src/main/test/java"]
    resources.srcDirs = ["src/test/resources", "src/main/test/resources"]
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
  runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.9'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'
  implementation 'io.nats:jnats:2.20.5'

  implementation('org.json:json:20240303') {
    because 'previous versions are affected by multiple CVE'
  }
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10'
  implementation('io.socket:socket.io-client:2.1.2') {
    exclude group: 'org.json', module: 'json'
  }
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation ('ch.qos.logback:logback-core:1.5.34') {
    because 'version brought in by spring boot 3.5.14 affected by CVE-2024-12798'
  }
  implementation 'ch.qos.logback:logback-classic:1.5.34'
  implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
  implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.26.1'
  implementation 'org.apache.commons:commons-lang3:3.20.0'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  // in-memory DB so the inherited @SpringBootTest context can load without a MariaDB
  testRuntimeOnly 'com.h2database:h2:2.3.232'
  // Integration tier only: real MariaDB + real NATS so the Spring context can be started the way
  // it actually runs. The inherited contextLoads smoke cannot do this -- tradePublisher dials
  // nats.address during bean creation -- so TradeProcessorContextIT covers it against real infra.
  testImplementation 'org.testcontainers:testcontainers:1.20.4'
  testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
  testImplementation 'org.testcontainers:mariadb:1.20.4'
}

// TradeProcessorApplicationTests is a @SpringBootTest whose context REQUIRES a live NATS broker:
// the tradePublisher bean dials nats.address during bean creation and there is no disable flag.
// That makes it an INTEGRATION test mislabeled as a unit test -- it needs a broker and a DB, so it
// does not belong in the infrastructure-free unit job. It is excluded here DELIBERATELY and
// visibly (it still compiles) rather than left silently inert as it was before 2026-07-28; the
// right home for it is the Testcontainers tier alongside TradeProcessorPersistenceIT.
test {
  useJUnitPlatform { excludeTags 'integration' }
  filter {
    excludeTestsMatching 'finos.traderx.tradeprocessor.TradeProcessorApplicationTests'
  }
}

// Needs a Docker daemon (Testcontainers). Kept OUT of the infrastructure-free unit task so the
// hosted CI job stays fast and Docker-free; run by its own CI job, same split as the template's
// TradeProcessorPersistenceIT.
tasks.register('integrationTest', Test) {
  description = 'Context load against real MariaDB + NATS containers.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform { includeTags 'integration' }
  shouldRunAfter test
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
}

configurations.configureEach {
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
