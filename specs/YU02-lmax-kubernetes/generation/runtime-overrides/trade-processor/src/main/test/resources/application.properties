# Test-only overrides so the inherited @SpringBootTest smoke test can load a context with no
# external infrastructure. Production config (src/main/resources) points at MariaDB and NATS and
# is untouched. This file only exists on the TEST classpath.
spring.datasource.url=jdbc:h2:mem:traderx;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.data.jpa.database-platform=org.hibernate.dialect.H2Dialect
# production runs ddl-auto=none against the configmap schema; the smoke test builds from entities
spring.jpa.hibernate.ddl-auto=create-drop
server.port=0
eod.event.enabled=false
# This file SHADOWS src/main/resources/application.properties on the test classpath, so it must
# also carry the two placeholders the context dereferences with no inline default (${server.port}
# above, ${nats.address} here) or bean creation fails on an unresolved placeholder.
nats.address=nats://localhost:4222
