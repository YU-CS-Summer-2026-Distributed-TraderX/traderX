apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init-sql
  namespace: traderx
data:
  001-initialSchema.sql: |
    DROP TABLE IF EXISTS eod_position_pnl;
    DROP TABLE IF EXISTS eod_price_snapshot;
    DROP TABLE IF EXISTS eod_price_session;
    DROP TABLE IF EXISTS trades;
    DROP TABLE IF EXISTS orderbook;
    DROP TABLE IF EXISTS accountusers;
    DROP TABLE IF EXISTS positions;
    DROP TABLE IF EXISTS accounts;
    DROP SEQUENCE IF EXISTS accounts_seq;

    CREATE TABLE accounts (
      id INTEGER PRIMARY KEY,
      displayname VARCHAR(50)
    );

    CREATE TABLE accountusers (
      accountid INTEGER NOT NULL,
      username VARCHAR(15) NOT NULL,
      PRIMARY KEY (accountid, username),
      FOREIGN KEY (accountid) REFERENCES accounts(id)
    );

    CREATE TABLE positions (
      accountid INTEGER,
      security VARCHAR(32),
      updated DATETIME,
      quantity INTEGER,
      averagecostbasis DECIMAL(18,3),
      PRIMARY KEY (accountid, security),
      FOREIGN KEY (accountid) REFERENCES accounts(id)
    );

    CREATE TABLE trades (
      id VARCHAR(50) PRIMARY KEY,
      accountid INTEGER REFERENCES accounts(id),
      created DATETIME,
      updated DATETIME,
      security VARCHAR(32),
      side VARCHAR(10) CHECK (side in ('Buy', 'Sell')),
      quantity INTEGER CHECK (quantity > 0),
      price DECIMAL(18,3),
      state VARCHAR(20) CHECK (state in ('New', 'Processing', 'Settled', 'Cancelled')),
      settlementdate DATETIME
    );

    CREATE TABLE orderbook (
      orderid VARCHAR(32) PRIMARY KEY,
      accountid INTEGER NOT NULL,
      security VARCHAR(32) NOT NULL,
      side VARCHAR(16) CHECK (side in ('Buy', 'Sell')),
      quantity INTEGER NOT NULL CHECK (quantity > 0),
      remainingquantity INTEGER NOT NULL CHECK (remainingquantity >= 0),
      limitprice DECIMAL(18,3) NOT NULL,
      status VARCHAR(24) CHECK (status in ('NEW', 'PARTIALLY_FILLED', 'FILLED', 'CANCELED', 'REJECTED')),
      createdat DATETIME NOT NULL,
      updatedat DATETIME NOT NULL,
      lastexecutionprice DECIMAL(18,3),
      lastfillquantity INTEGER
    );
    CREATE INDEX idx_orderbook_status ON orderbook(status);
    CREATE INDEX idx_orderbook_updatedat ON orderbook(updatedat);

    -- YU06 EOD price production: versioned immutable closing-price snapshot (single
    -- source of truth for every overnight batch job) + the first consumer's P&L output.
    CREATE TABLE eod_price_session (
      session_date DATE NOT NULL,
      version INTEGER NOT NULL,
      status VARCHAR(16) CHECK (status in ('DRAFT', 'PUBLISHED')),
      instrument_count INTEGER NOT NULL DEFAULT 0,
      flagged_count INTEGER NOT NULL DEFAULT 0,
      created_at DATETIME,
      published_at DATETIME,
      PRIMARY KEY (session_date, version)
    );

    CREATE TABLE eod_price_snapshot (
      session_date DATE NOT NULL,
      version INTEGER NOT NULL,
      security VARCHAR(32) NOT NULL,
      closing_price DECIMAL(18,6),
      quality VARCHAR(16) CHECK (quality in ('OK', 'STALE', 'SPIKE', 'MISSING', 'OVERRIDDEN')),
      source_tick_millis BIGINT,
      override_reason VARCHAR(255),
      PRIMARY KEY (session_date, version, security),
      FOREIGN KEY (session_date, version) REFERENCES eod_price_session(session_date, version)
    );

    -- Consumer output (position-service). Immutable/idempotent per (date, version, account, security);
    -- no FK to accounts so a late consumer never blocks on reference-data ordering. Derived data.
    CREATE TABLE eod_position_pnl (
      session_date DATE NOT NULL,
      version INTEGER NOT NULL,
      account_id INTEGER NOT NULL,
      security VARCHAR(32) NOT NULL,
      quantity INTEGER NOT NULL,
      closing_price DECIMAL(18,6) NOT NULL,
      market_value DECIMAL(20,6) NOT NULL,
      marked_at DATETIME,
      PRIMARY KEY (session_date, version, account_id, security)
    );
    CREATE INDEX idx_eod_pnl_session ON eod_position_pnl(session_date, version);

    CREATE SEQUENCE accounts_seq START WITH 65000 INCREMENT BY 1;

