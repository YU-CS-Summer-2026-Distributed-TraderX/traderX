apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-extract
spec:
  replicas: 1
  # Singleton bound to one JetStream durable: a rolling update overlaps old and new pods on the
  # same durable and the new one is refused the bind ([SUB-90012]). Never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: risk-extract
  template:
    metadata:
      labels:
        app: risk-extract
    spec:
      containers:
        - name: risk-extract
          image: traderx/cluster-node:yu15
          imagePullPolicy: IfNotPresent
          # Same image as the node and the gateway, a different main — the cluster tier's
          # established shape (ADR-047).
          command:
            - java
            - -cp
            - /opt/app/classes:/opt/app/lib/*
            - finos.traderx.ordermatcher.cluster.RiskExtractMain
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CLUSTER_INGRESS_ENDPOINTS
              value: "0=order-matcher-cluster-0.order-matcher-cluster.traderx.svc.cluster.local:21802,1=order-matcher-cluster-1.order-matcher-cluster.traderx.svc.cluster.local:21902,2=order-matcher-cluster-2.order-matcher-cluster.traderx.svc.cluster.local:22002"
            - name: RISK_EXTRACT_EGRESS_PORT
              value: "40480"
            - name: RISK_EXTRACT_NATS_URL
              value: "nats://nats:4222"
            - name: RISK_EXTRACT_JDBC_URL
              value: "jdbc:mariadb://eod-price-db:3306/traderx"
            - name: RISK_EXTRACT_JDBC_USER
              value: "traderx"
            - name: RISK_EXTRACT_JDBC_PASSWORD
              value: "traderx"
            # file:// on kind; the GKE overlay sets a gs:// URI plus the HMAC secret pair and
            # nothing else changes (RiskExtractGcsSink enforces write-once server-side).
            - name: RISK_EXTRACT_SINK_URI
              value: "file:///data/risk-extracts"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          volumeMounts:
            - name: extracts
              mountPath: /data/risk-extracts
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
      volumes:
        - name: extracts
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
