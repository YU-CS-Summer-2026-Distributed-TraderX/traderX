apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-extract
spec:
  replicas: 1
  # Singleton bound to one JetStream durable: a rolling update overlaps old and new pods on the
  # same durable and the new one is refused the bind ([SUB-90012]). Never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: risk-extract
  template:
    metadata:
      labels:
        app: risk-extract
    spec:
      containers:
        - name: risk-extract
          image: us-east1-docker.pkg.dev/traderx-505400/traderx/cluster-node:yu15-idempfix
          imagePullPolicy: Always
          # Same image as the node and the gateway, a different main — the cluster tier's
          # established shape (ADR-047).
          command:
            - java
            - -cp
            - /opt/app/classes:/opt/app/lib/*
            - finos.traderx.ordermatcher.cluster.RiskExtractMain
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CLUSTER_INGRESS_ENDPOINTS
              value: "0=order-matcher-cluster-0.order-matcher-cluster.traderx.svc.cluster.local:21802,1=order-matcher-cluster-1.order-matcher-cluster.traderx.svc.cluster.local:21902,2=order-matcher-cluster-2.order-matcher-cluster.traderx.svc.cluster.local:22002"
            - name: RISK_EXTRACT_EGRESS_PORT
              value: "40480"
            - name: RISK_EXTRACT_NATS_URL
              value: "nats://nats:4222"
            - name: RISK_EXTRACT_JDBC_URL
              value: "jdbc:mariadb://eod-price-db:3306/traderx"
            - name: RISK_EXTRACT_JDBC_USER
              value: "traderx"
            - name: RISK_EXTRACT_JDBC_PASSWORD
              value: "traderx"
            # The real delivery: a write-once object in GCS. RiskExtractGcsSink enforces
            # no-clobber server-side (x-goog-if-generation-match: 0), and on 501015 the bucket
            # granted the HMAC's SA objectCreator+objectViewer only — no delete, so overwrite was
            # impossible even with these creds. Same journal-archive HMAC pair the restore init uses.
            #
            # THAT SECOND HALF DOES NOT YET HOLD ON 505400. The bucket exists (created 2026-08-17)
            # but there is no workload identity on this project to bind, so the objectCreator-only
            # grant that makes the sink immutable has nothing to attach to. Today the guarantee is
            # the client-side one alone: RiskExtractGcsSink's no-clobber precondition, which is a
            # correctly-behaving-writer guarantee, not an IAM one. The binding and its 403-on-
            # overwrite proof go with the GKE bring-up — do not quote the YU15 write-once guarantee
            # for this project until that proof has run.
            - name: RISK_EXTRACT_SINK_URI
              value: "gs://traderx-505400-risk-extracts"
            - name: RISK_EXTRACT_GCS_HMAC_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: order-matcher-journal-gcs-hmac
                  key: access-key-id
            - name: RISK_EXTRACT_GCS_HMAC_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: order-matcher-journal-gcs-hmac
                  key: secret-access-key
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          volumeMounts:
            - name: extracts
              mountPath: /data/risk-extracts
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
      volumes:
        - name: extracts
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
