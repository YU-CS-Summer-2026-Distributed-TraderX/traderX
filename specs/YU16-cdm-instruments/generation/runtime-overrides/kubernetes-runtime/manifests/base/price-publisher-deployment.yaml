apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-publisher
  namespace: traderx
  labels:
    app: price-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: price-publisher
  template:
    metadata:
      labels:
        app: price-publisher
    spec:
      containers:
        - name: price-publisher
          image: traderx/price-publisher:state009
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18100
              protocol: TCP
          env:
            - name: PRICE_PUBLISHER_PORT
              value: "18100"
            - name: NATS_BROKER_HOST
              value: "nats-broker"
            - name: PRICE_BOOTSTRAP_MODE
              value: "snapshot"
            - name: PRICE_TICKERS
              value: "AAPL,MSFT,AMZN,GOOGL,META,NVDA,TSLA,IBM,BAC,C,JPM,GS,MS,UBS,DB,COF,DFS,FNMA,FIS,FNF,SPY,QQQ,IWM,VTI,GLD,UST-20280630,UST-20310630,UST-20360515,UST-20460515,UST-20560515,UST-20290715,UST-20330731,UST-BILL-20260910,UST-BILL-20261112,UST-BILL-20270211,UST-BILL-20270812,UST-STRIP-20280630,UST-STRIP-20310630,UST-STRIP-20360515,UST-STRIP-20560515,CORP-IBM-20330215,CORP-JPM-20310601,CORP-GS-20360315,CORP-F-20320512"
