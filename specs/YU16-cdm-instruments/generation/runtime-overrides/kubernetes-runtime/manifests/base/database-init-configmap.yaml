    -- YU14 made listed options tradeable, and an unpadded OCC symbol (AAPL260918C00240000)
    -- is 19 characters. Every instrument-identifier column was VARCHAR(15)/(16), so MariaDB's
    -- strict mode rejected the insert and every option fill the ADR-048 trade bridge published
    -- was dropped on the floor by trade-processor. CREATE IF NOT EXISTS cannot widen an
    -- existing column, so a populated volume needs an explicit MODIFY; re-running one is a
    -- no-op once the column is already VARCHAR(32). The JPA entities already declare
    -- @Column(length = 50), so only the schema was ever the constraint.
    ALTER TABLE positions MODIFY COLUMN security VARCHAR(32);
    ALTER TABLE trades MODIFY COLUMN security VARCHAR(32);
    ALTER TABLE orderbook MODIFY COLUMN security VARCHAR(32) NOT NULL;
    ALTER TABLE eod_price_snapshot MODIFY COLUMN security VARCHAR(32) NOT NULL;
    ALTER TABLE eod_position_pnl MODIFY COLUMN security VARCHAR(32) NOT NULL;
    ALTER TABLE stocks MODIFY COLUMN ticker VARCHAR(32) NOT NULL;
    ALTER TABLE stocks_control_outbox MODIFY COLUMN ticker VARCHAR(32) NOT NULL;

    -- YU05 added trades.settlementdate; CREATE IF NOT EXISTS cannot add a column
    -- to a pre-YU05 table, so assert it explicitly (MariaDB extension).
    ALTER TABLE trades ADD COLUMN IF NOT EXISTS settlementdate DATETIME;

    -- YU16 (ADR-057/FR-CDM15): a bond price is a FRACTION of par, and three decimals on a
    -- fraction is one decimal of percentage - 0.998780 would silently round to 0.999. Widen
    -- every column that can carry a bond price to six decimals; re-running a MODIFY that is
    -- already applied is a no-op. The state CHECK gains 'Rejected' (FR-CDM23): MariaDB names a
    -- column-level CHECK after its column, so drop-and-re-add under that name; both statements
    -- are idempotent on a volume already at this state's schema.
    ALTER TABLE trades MODIFY COLUMN price DECIMAL(18,6);
    ALTER TABLE positions MODIFY COLUMN averagecostbasis DECIMAL(18,6);
    ALTER TABLE orderbook MODIFY COLUMN limitprice DECIMAL(18,6) NOT NULL;
    ALTER TABLE orderbook MODIFY COLUMN lastexecutionprice DECIMAL(18,6);
    ALTER TABLE trades ADD COLUMN IF NOT EXISTS rejectionreason VARCHAR(255);
    ALTER TABLE trades ADD COLUMN IF NOT EXISTS sourceorderid VARCHAR(50);
    ALTER TABLE trades DROP CONSTRAINT IF EXISTS state;
    ALTER TABLE trades ADD CONSTRAINT state CHECK (state in ('New', 'Processing', 'Settled', 'Cancelled', 'Rejected'));

    -- YU17 (brief 07): orderbook.traceid. CREATE IF NOT EXISTS cannot add a column to a table that
    -- already exists, and trade-processor runs ddl-auto=none, so a populated volume needs this
    -- explicit ADD or every order write fails on an unknown column. Re-running it is a no-op.
    ALTER TABLE orderbook ADD COLUMN IF NOT EXISTS traceid VARCHAR(32);
