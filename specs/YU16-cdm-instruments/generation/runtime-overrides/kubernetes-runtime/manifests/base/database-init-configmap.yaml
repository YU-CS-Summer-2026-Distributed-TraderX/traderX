    -- YU04 durable control feeds: account-service and reference-data outbox/epoch tables + the
    -- reference-data stocks table (previously CSV-only). Inherited from YU04; needed here so the
    -- control feeds bootstrap on kind. Both *_source_epoch tables self-seed to epoch=1 on first boot.
    CREATE TABLE IF NOT EXISTS account_control_outbox (
      version BIGINT AUTO_INCREMENT PRIMARY KEY,
      account_id INTEGER NOT NULL,
      display_name VARCHAR(50),
      published BOOLEAN NOT NULL DEFAULT FALSE,
      created_at TIMESTAMP NOT NULL
    );

    CREATE TABLE IF NOT EXISTS account_source_epoch (
      epoch BIGINT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS stocks (
      ticker VARCHAR(32) PRIMARY KEY,
      company_name VARCHAR(120)
    );

    CREATE TABLE IF NOT EXISTS stocks_control_outbox (
      version BIGINT AUTO_INCREMENT PRIMARY KEY,
      ticker VARCHAR(32) NOT NULL,
      company_name VARCHAR(120),
      published BOOLEAN NOT NULL DEFAULT FALSE,
      created_at TIMESTAMP NOT NULL
    );

    CREATE TABLE IF NOT EXISTS stocks_source_epoch (
      epoch BIGINT NOT NULL
