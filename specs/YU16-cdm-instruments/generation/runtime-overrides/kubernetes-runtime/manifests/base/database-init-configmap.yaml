    -- YU04 durable control feeds: account-service and reference-data outbox/epoch tables + the
    -- reference-data stocks table (previously CSV-only). Inherited from YU04; needed here so the
    -- control feeds bootstrap on kind. Both *_source_epoch tables self-seed to epoch=1 on first boot.
