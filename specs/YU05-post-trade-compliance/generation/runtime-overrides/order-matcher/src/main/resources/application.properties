server.port=${ORDER_MATCHER_PORT:18110}

spring.datasource.url=jdbc:mariadb://${DATABASE_PG_HOST:localhost}:${DATABASE_PG_PORT:3306}/${DATABASE_NAME:traderx}?rewriteBatchedStatements=true
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${DATABASE_DBUSER:traderx}
spring.datasource.password=${DATABASE_DBPASS:traderx}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
# Cutover (no-DB boot): set SPRING_JPA_DDL_AUTO=none, HIKARI_INIT_FAIL_TIMEOUT=-1 (don't block startup on
# the DB), MANAGEMENT_HEALTH_DB_ENABLED=false (keep /health green without the DB). Defaults keep db-mode.
spring.datasource.hikari.initialization-fail-timeout=${HIKARI_INIT_FAIL_TIMEOUT:30000}
management.health.db.enabled=${MANAGEMENT_HEALTH_DB_ENABLED:true}
# Option 1 — projector DB write path: batch the order/position writes so N inserts/updates ride one
# JDBC round-trip instead of one each. The remaining cost is the database-side upsert/update work.
# (merge still does a per-row SELECT; that is the orders/positions tail option 3 would remove.)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.threads.virtual.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,lmaxRecovery

order.matcher.price-service-url=${PRICE_SERVICE_URL:http://${PRICE_SERVICE_HOST:localhost}:18100}
order.matcher.trade-service-url=${TRADE_SERVICE_URL:http://${TRADE_SERVICE_HOST:localhost}:18092/trade/}
order.matcher.fill-full-threshold=${ORDER_FILL_FULL_THRESHOLD:1000}
order.matcher.seed-enabled=${ORDER_MATCHER_SEED_ENABLED:true}
nats.address=${NATS_ADDRESS:nats://${NATS_BROKER_HOST:localhost}:4222}

# LMAX hot path (state 009b). The 009 polling tick (order.matcher.tick-ms) is removed:
# matching is event-driven off the sequenced input ring (FR-09B02).
runtime.profile=${RUNTIME_PROFILE:demo}
disruptor.input.ring-size=${DISRUPTOR_INPUT_RING_SIZE:65536}
disruptor.input.wait-strategy=${DISRUPTOR_INPUT_WAIT_STRATEGY:blocking}
disruptor.output.ring-size=${DISRUPTOR_OUTPUT_RING_SIZE:65536}
disruptor.output.wait-strategy=${DISRUPTOR_OUTPUT_WAIT_STRATEGY:blocking}
journal.enabled=${ORDER_MATCHER_JOURNAL_ENABLED:true}
journal.path=${ORDER_MATCHER_JOURNAL_PATH:./data/journal}
journal.replay.verify=${JOURNAL_REPLAY_VERIFY:true}
journal.batch.records=${ORDER_MATCHER_JOURNAL_BATCH_RECORDS:1024}
output.legacy-trades.enabled=${OUTPUT_LEGACY_TRADES_ENABLED:false}
output.projector.batch-size=${OUTPUT_PROJECTOR_BATCH_SIZE:500}
output.projector.queue-capacity=${OUTPUT_PROJECTOR_QUEUE_CAPACITY:1000000}
output.projector.db.enabled=${OUTPUT_PROJECTOR_DB_ENABLED:true}
blp.books.max-securities=${BLP_MAX_SECURITIES:4096}
blp.book.pool-size=${BLP_BOOK_POOL_SIZE:65536}
blp.terminal.retain=${BLP_TERMINAL_RETAIN:262144}
blp.gateway.ack-timeout-ms=${BLP_GATEWAY_ACK_TIMEOUT_MS:5000}
snapshot.interval.ms=${SNAPSHOT_INTERVAL_MS:300000}
recovery.source=${RECOVERY_SOURCE:db}
blp.replication.enabled=${BLP_REPLICATION_ENABLED:false}
blp.pod.name=${BLP_POD_NAME:order-matcher-0}

# To avoid "Request header is too large" when application is backed by oidc proxy.
server.max-http-request-header-size=1000000

logging.level.root=info

# In-memory risk gateway: Gateway replica seeds, authoritative BLP limits, control-plane token.
risk.enabled=${RISK_ENABLED:true}
risk.seed.accounts=${RISK_SEED_ACCOUNTS:22214,44044,52355,10031,62654}
risk.seed.securities=${RISK_SEED_SECURITIES:IBM,MSFT,JPM,GS,NVDA,C,META,MS,BAC,PARITYA,PARITYB,PARITYC,PARITYD,PARITYE,POSBUY,POSSELL,POSMKT}
risk.max-accounts=${RISK_MAX_ACCOUNTS:4096}
risk.max-order-quantity=${RISK_MAX_ORDER_QUANTITY:1000000}
risk.max-order-notional-ticks=${RISK_MAX_ORDER_NOTIONAL_TICKS:1000000000000000}
risk.max-position-quantity=${RISK_MAX_POSITION_QUANTITY:1000000}
risk.max-concentration-notional-ticks=${RISK_MAX_CONCENTRATION_NOTIONAL_TICKS:5000000000000000}
risk.credit-limit-ticks=${RISK_CREDIT_LIMIT_TICKS:5000000000000000}
risk.price.max-age-ms=${RISK_PRICE_MAX_AGE_MS:30000}
risk.price.collar-bps=${RISK_PRICE_COLLAR_BPS:5000}
risk.idempotency.capacity=${RISK_IDEMPOTENCY_CAPACITY:65536}
risk.control.token=${RISK_CONTROL_TOKEN:dev-risk-control}

# YU04 (ADR-019/ADR-021): durable control-feed bootstrap replacing YU03's one-shot REST fetch.
# Subscribes to each source's JetStream stream (see nats.address above) and fetches its
# watermarked snapshot before admitting any control-feed data (subscribe-buffer-snapshot-catchup).
risk.bootstrap.enabled=${RISK_BOOTSTRAP_ENABLED:true}
risk.bootstrap.buffer-capacity=${RISK_BOOTSTRAP_BUFFER_CAPACITY:8192}
risk.bootstrap.account-stream=${RISK_BOOTSTRAP_ACCOUNT_STREAM:TRADERX_CONTROL_ACCOUNT}
risk.bootstrap.account-subject=${RISK_BOOTSTRAP_ACCOUNT_SUBJECT:traderx.control.account.deltas}
risk.bootstrap.accounts-snapshot-url=${RISK_BOOTSTRAP_ACCOUNTS_SNAPSHOT_URL:http://account-service:18088/account/control-snapshot}
risk.bootstrap.security-stream=${RISK_BOOTSTRAP_SECURITY_STREAM:TRADERX_CONTROL_SECURITY}
risk.bootstrap.security-subject=${RISK_BOOTSTRAP_SECURITY_SUBJECT:traderx.control.security.deltas}
risk.bootstrap.securities-snapshot-url=${RISK_BOOTSTRAP_SECURITIES_SNAPSHOT_URL:http://reference-data:18085/stocks/control-snapshot}

# Post-trade compliance (state YU05): replay-safe trade blotter + reconciliation read API.
recon.blotter.capacity=${RECON_BLOTTER_CAPACITY:500000}
recon.blotter.page-size=${RECON_BLOTTER_PAGE_SIZE:1000}

# Post-trade compliance (state YU05, ADR-025, FR-PTC40): shared HS256 JWT secret. MUST match
# trade-processor's auth.jwt.secret exactly (that's what makes a token minted by either service's
# /auth/dev-token endpoint valid against both). Real deployment: a real secret (or, once a live
# OIDC provider exists, JWKS-based verification instead of a shared secret entirely).
auth.jwt.secret=${AUTH_JWT_SECRET:dev-jwt-shared-secret}

# Post-trade compliance (state YU05, FR-PTC02/06): settlement lifecycle. The Projector (not
# trade-processor) is the live TRADES writer, so this lives here — see research.md.
settlement.t-plus-days=${SETTLEMENT_T_PLUS_DAYS:1}
