apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-grafana-dashboards
  namespace: traderx
data:
  traderx-post-trade-compliance.json: |
    {
      "uid": "traderx-post-trade-compliance",
      "title": "TraderX Post-Trade Compliance (YU05)",
      "schemaVersion": 39,
      "refresh": "10s",
      "tags": ["traderx", "post-trade", "settlement", "reconciliation", "tca", "prometheus", "provisioned"],
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Coverage note",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "options": {
            "mode": "markdown",
            "content": "Settlement/reconciliation metrics below come from trade-processor (Micrometer/`/actuator/prometheus`). Order-matcher's trade blotter (size, evictions) and full-history reindex results are **not** in this panel set yet — they're exposed as JSON only (`POST /recon/full-history/reindex` response, `GET /recon/trades/blotter`), not as Prometheus gauges, since order-matcher's own metrics use a separate hand-rolled hot-path exporter, not Micrometer."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Recon Cursor (tradeSeq)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 4 },
          "targets": [{ "refId": "A", "expr": "max(traderx_recon_cursor)" }]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Matched/sec (5m)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 4 },
          "targets": [{ "refId": "A", "expr": "sum(rate(traderx_recon_matched_total[5m]))" }],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "green" } } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Field Mismatches/sec (5m)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 4 },
          "targets": [{ "refId": "A", "expr": "sum(rate(traderx_recon_field_mismatch_total[5m]))" }],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.001 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Orphans (last full-history sweep)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 4 },
          "targets": [{ "refId": "A", "expr": "max(traderx_recon_orphan_total)" }],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Reconciliation Classifications (5m rate)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "targets": [
            { "refId": "A", "expr": "sum(rate(traderx_recon_matched_total[5m]))", "legendFormat": "matched" },
            { "refId": "B", "expr": "sum(rate(traderx_recon_missing_in_projection_total[5m]))", "legendFormat": "missing_in_projection" },
            { "refId": "C", "expr": "sum(rate(traderx_recon_field_mismatch_total[5m]))", "legendFormat": "field_mismatch" }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Trades Settled/sec (5m rate)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "targets": [
            { "refId": "A", "expr": "sum(rate(traderx_settlement_swept_total[5m]))" }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "TCA / Regulatory Report Request Rate (5m)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 17 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (uri, status) (rate(http_server_requests_seconds_count{job=\"traderx-spring-boot-actuator\",instance=~\".*trade-processor.*\",uri=~\"/tca/.*|/recon/.*\"}[5m]))",
              "legendFormat": "trade-processor {{uri}} ({{status}})"
            },
            {
              "refId": "B",
              "expr": "sum by (uri, status) (rate(http_server_requests_seconds_count{job=\"traderx-spring-boot-actuator\",instance=~\".*order-matcher.*\",uri=~\"/regulatory/.*\"}[5m]))",
              "legendFormat": "order-matcher {{uri}} ({{status}})"
            }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } }
        }
      ]
    }
  traderx-lmax-benchmark-throughput.json: |
    {
      "id": null,
      "uid": "traderx-lmax-benchmark-throughput",
      "title": "TraderX LMAX Benchmark Throughput",
      "tags": ["traderx", "lmax", "benchmark", "throughput", "blp", "provisioned"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "How to run it",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "options": {
            "mode": "markdown",
            "content": "**This dashboard shows the pure in-process benchmark path, not the live REST platform path.**\n\nRun it with:\n\n```bash\nbash /scripts/bench/run-blp-dashboard-bench.sh\n```\n\nDirect trigger endpoint:\n\n```bash\ncurl -X POST 'http://localhost:18110/system/benchmarks/blp/run?warmupOrders=500000&measuredOrders=40000000&waitStrategy=yielding'\n```\n\nThe benchmark uses the input ring, single-threaded BLP, and output ring only. It removes HTTP order ingress, JSON, NATS, DB, projector, and journal I/O from the measured path."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Benchmark Running",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 6 },
          "targets": [{ "refId": "A", "expr": "max(traderx_benchmark_blp_running)" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 } }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Benchmark BLP (current)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 6 },
          "targets": [{ "refId": "A", "expr": "max(traderx_benchmark_blp_events_per_second_current)" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "cps", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "green" } } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Benchmark BLP (peak)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 6 },
          "targets": [{ "refId": "A", "expr": "max(traderx_benchmark_blp_events_per_second_peak)" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "cps", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "dark-green" } } }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Sustained Orders/sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 6 },
          "targets": [{ "refId": "A", "expr": "max(traderx_benchmark_blp_last_sustained_orders_per_second)" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "cps", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "orange" } } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Benchmark Input Throughput",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "max(traderx_benchmark_input_events_per_second_current)", "legendFormat": "current" },
            { "refId": "B", "expr": "max(traderx_benchmark_input_events_per_second_peak)", "legendFormat": "peak" }
          ],
          "fieldConfig": { "defaults": { "unit": "cps", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" } } },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Benchmark BLP Throughput",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "max(traderx_benchmark_blp_events_per_second_current)", "legendFormat": "current" },
            { "refId": "B", "expr": "max(traderx_benchmark_blp_events_per_second_peak)", "legendFormat": "peak" }
          ],
          "fieldConfig": { "defaults": { "unit": "cps", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" } } },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Benchmark Output Throughput",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "targets": [
            { "refId": "A", "expr": "max(traderx_benchmark_output_events_per_second_current)", "legendFormat": "current" },
            { "refId": "B", "expr": "max(traderx_benchmark_output_events_per_second_peak)", "legendFormat": "peak" }
          ],
          "fieldConfig": { "defaults": { "unit": "cps", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" } } },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Benchmark Trades/sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "targets": [
            { "refId": "A", "expr": "max(traderx_benchmark_trades_per_second_current)", "legendFormat": "current" },
            { "refId": "B", "expr": "max(traderx_benchmark_trades_per_second_peak)", "legendFormat": "peak" }
          ],
          "fieldConfig": { "defaults": { "unit": "cps", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" } } },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi" } }
        }
      ]
    }
  traderx-lmax-throughput.json: |
    {
      "id": null,
      "uid": "traderx-lmax-throughput",
      "title": "TraderX LMAX Throughput",
      "tags": ["traderx", "lmax", "throughput", "disruptor", "orders", "provisioned"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["1s", "2s", "5s", "10s", "30s", "1m"]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "How to read this",
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 0 },
          "options": {
            "mode": "markdown",
            "content": "**These are in-process throughput gauges, not reconstructed Prometheus irate spikes.**\n\n- **Input disruptor throughput** = input events consumed through the input ring into the BLP.\n- **BLP throughput** = events completed by the single-threaded business logic processor.\n- **Output disruptor throughput** = output events consumed from the output ring.\n- **Trades/sec** = booked trades only.\n\nAll four are measured inside the matcher over rolling **100 ms** windows and exported as live gauges plus peak-since-restart gauges. Because the values are computed in-process, Grafana can show short bursts more accurately than panels built only from `rate(...)` or `irate(...)` on the service's own `/metrics` endpoint.\n\n**Important:** input-ring throughput and BLP throughput should be very close in healthy steady state because the BLP is the sole input-ring consumer."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Input Disruptor (current)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 5 },
          "targets": [{ "refId": "A", "expr": "max(traderx_input_events_per_second_current)" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "cps", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "blue" } } }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "BLP (current)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 5 },
          "targets": [{ "refId": "A", "expr": "max(traderx_blp_events_per_second_current)" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "cps", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "green" } } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Output Disruptor (current)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 5 },
          "targets": [{ "refId": "A", "expr": "max(traderx_output_events_per_second_current)" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "cps", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "orange" } } }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Trades/sec (current)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 5 },
          "targets": [{ "refId": "A", "expr": "max(traderx_trades_per_second_current)" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "cps", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "purple" } } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Input Disruptor Throughput",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "max(traderx_input_events_per_second_current)", "legendFormat": "current" },
            { "refId": "B", "expr": "max(traderx_input_events_per_second_peak)", "legendFormat": "peak since restart" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "BLP Throughput",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "max(traderx_blp_events_per_second_current)", "legendFormat": "current" },
            { "refId": "B", "expr": "max(traderx_blp_events_per_second_peak)", "legendFormat": "peak since restart" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Output Disruptor Throughput",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "targets": [
            { "refId": "A", "expr": "max(traderx_output_events_per_second_current)", "legendFormat": "current" },
            { "refId": "B", "expr": "max(traderx_output_events_per_second_peak)", "legendFormat": "peak since restart" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Booked Trades Throughput",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "targets": [
            { "refId": "A", "expr": "max(traderx_trades_per_second_current)", "legendFormat": "current" },
            { "refId": "B", "expr": "max(traderx_trades_per_second_peak)", "legendFormat": "peak since restart" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi" } }
        }
      ]
    }
  traderx-logs-errors.json: |
    {
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "lines/s"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "expr": "sum by (service) (rate({compose_project=\"traderx-state-009\",service=~\"$service\"}[1m]))",
              "refId": "A"
            }
          ],
          "title": "Log Throughput by Service",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "lines/s"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "expr": "sum by (service) (rate({compose_project=\"traderx-state-009\",service=~\"$service\"} |~ \"(?i)(error|warn|exception|fail)\" [1m]))",
              "refId": "A"
            }
          ],
          "title": "Error/Warn Throughput by Service",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "options": {
            "enableLogDetails": true,
            "showLabels": true,
            "showTime": true,
            "wrapLogMessage": true
          },
          "targets": [
            {
              "expr": "{compose_project=\"traderx-state-009\",service=~\"$service\"}",
              "refId": "A"
            }
          ],
          "title": "Live Logs (Selected Services)",
          "type": "logs"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "id": 4,
          "options": {
            "enableLogDetails": true,
            "showLabels": true,
            "showTime": true,
            "wrapLogMessage": true
          },
          "targets": [
            {
              "expr": "{compose_project=\"traderx-state-009\",service=~\"$service\"} |~ \"(?i)(error|warn|exception|fail)\"",
              "refId": "A"
            }
          ],
          "title": "Error Focus",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "traderx",
        "logs",
        "provisioned"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "All",
              "value": [
                "$__all"
              ]
            },
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "includeAll": true,
            "label": "Service",
            "multi": true,
            "name": "service",
            "query": "label_values({compose_project=\"traderx-state-009\"}, service)",
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "TraderX Logs & Errors",
      "uid": "traderx-logs-errors"
    }
  traderx-message-bus-connectivity.json: |
    {
      "id": null,
