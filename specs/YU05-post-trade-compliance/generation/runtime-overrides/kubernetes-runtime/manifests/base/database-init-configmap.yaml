    -- YU04 durable control feeds: account-service and reference-data outbox/epoch tables + the
    -- reference-data stocks table (previously CSV-only). These live only in a test-only H2
    -- schema.sql in the service overrides; the real deployed schema belongs here in the init SQL.
    -- Both *_source_epoch tables are self-seeded to epoch=1 by the services on first boot.
    CREATE TABLE account_control_outbox (
      version BIGINT AUTO_INCREMENT PRIMARY KEY,
      account_id INTEGER NOT NULL,
      display_name VARCHAR(50),
      published BOOLEAN NOT NULL DEFAULT FALSE,
      created_at TIMESTAMP NOT NULL
    );

    CREATE TABLE account_source_epoch (
      epoch BIGINT NOT NULL
    );

    CREATE TABLE stocks (
      ticker VARCHAR(16) PRIMARY KEY,
      company_name VARCHAR(120)
    );

    CREATE TABLE stocks_control_outbox (
      version BIGINT AUTO_INCREMENT PRIMARY KEY,
      ticker VARCHAR(16) NOT NULL,
      company_name VARCHAR(120),
      published BOOLEAN NOT NULL DEFAULT FALSE,
      created_at TIMESTAMP NOT NULL
    );

    CREATE TABLE stocks_source_epoch (
      epoch BIGINT NOT NULL
    );
  # Idempotent desired-state schema for a PERSISTENT (PVC-backed) datadir. The MariaDB
  # entrypoint runs /docker-entrypoint-initdb.d only on an EMPTY volume, so this key is
  # (a) run by the entrypoint right after 001 on first boot (every statement no-ops), and
  # (b) applied by the schema-migrate initContainer on every later start, bringing a
  # populated volume from any older state's schema up to this state's (the YU02->YU09
  # evolution is purely additive: new tables, trades.settlementdate, one index).
  # Reference seeds (accounts/accountusers) are re-asserted with INSERT IGNORE because FKs
  # and entitlements need them; demo trades/positions are NOT re-asserted, so deliberately
  # deleted rows stay deleted. Derived mechanically from 001 - keep the two in sync.
  900-migrations.sql: |

    CREATE TABLE IF NOT EXISTS accounts (
      id INTEGER PRIMARY KEY,
      displayname VARCHAR(50)
    );

    CREATE TABLE IF NOT EXISTS accountusers (
      accountid INTEGER NOT NULL,
      username VARCHAR(15) NOT NULL,
      PRIMARY KEY (accountid, username),
      FOREIGN KEY (accountid) REFERENCES accounts(id)
    );

    CREATE TABLE IF NOT EXISTS positions (
      accountid INTEGER,
      security VARCHAR(15),
      updated DATETIME,
      quantity INTEGER,
      averagecostbasis DECIMAL(18,3),
      PRIMARY KEY (accountid, security),
      FOREIGN KEY (accountid) REFERENCES accounts(id)
    );

    CREATE TABLE IF NOT EXISTS trades (
      id VARCHAR(50) PRIMARY KEY,
      accountid INTEGER REFERENCES accounts(id),
      created DATETIME,
      updated DATETIME,
      security VARCHAR(15),
      side VARCHAR(10) CHECK (side in ('Buy', 'Sell')),
      quantity INTEGER CHECK (quantity > 0),
      price DECIMAL(18,3),
      state VARCHAR(20) CHECK (state in ('New', 'Processing', 'Settled', 'Cancelled')),
      settlementdate DATETIME
    );

    CREATE TABLE IF NOT EXISTS orderbook (
      orderid VARCHAR(32) PRIMARY KEY,
      accountid INTEGER NOT NULL,
      security VARCHAR(16) NOT NULL,
      side VARCHAR(16) CHECK (side in ('Buy', 'Sell')),
      quantity INTEGER NOT NULL CHECK (quantity > 0),
      remainingquantity INTEGER NOT NULL CHECK (remainingquantity >= 0),
      limitprice DECIMAL(18,3) NOT NULL,
      status VARCHAR(24) CHECK (status in ('NEW', 'PARTIALLY_FILLED', 'FILLED', 'CANCELED', 'REJECTED')),
      createdat DATETIME NOT NULL,
      updatedat DATETIME NOT NULL,
      lastexecutionprice DECIMAL(18,3),
      lastfillquantity INTEGER
    );
    CREATE INDEX IF NOT EXISTS idx_orderbook_status ON orderbook(status);
    CREATE INDEX IF NOT EXISTS idx_orderbook_updatedat ON orderbook(updatedat);

    CREATE SEQUENCE IF NOT EXISTS accounts_seq START WITH 65000 INCREMENT BY 1;

