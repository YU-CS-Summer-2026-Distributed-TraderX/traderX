apiVersion: v1
kind: Service
metadata:
  name: order-matcher-cluster
  labels:
    app: order-matcher-cluster
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: order-matcher-cluster
  ports:
    - name: health
      port: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-matcher-cluster
spec:
  serviceName: order-matcher-cluster
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: order-matcher-cluster
  template:
    metadata:
      labels:
        app: order-matcher-cluster
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: blp-pool
      tolerations:
        - key: workload
          operator: Equal
          value: blp
          effect: NoSchedule
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: order-matcher-cluster
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cluster-node
          image: us-east1-docker.pkg.dev/traderx-501015/traderx/cluster-node:yu14
          imagePullPolicy: Always
          env:
            - name: CLUSTER_HOSTNAMES
              value: "order-matcher-cluster-0.order-matcher-cluster.traderx.svc.cluster.local,order-matcher-cluster-1.order-matcher-cluster.traderx.svc.cluster.local,order-matcher-cluster-2.order-matcher-cluster.traderx.svc.cluster.local"
            - name: CLUSTER_PORT_BASE
              value: "21800"
            - name: CLUSTER_HEARTBEAT_INTERVAL_MS
              value: "100"
            - name: CLUSTER_HEARTBEAT_TIMEOUT_MS
              value: "1000"
            - name: CLUSTER_ELECTION_TIMEOUT_MS
              value: "500"
            - name: CLUSTER_BASE_DIR
              value: "/data"
            - name: CLUSTER_AERON_DIR
              value: "/dev/shm/aeron-cluster"
            # Analytical capture for the KDB-X tick store (brief 06). OFF on GKE by default: the
            # capture shares this volume with the Aeron Archive, and the banked throughput numbers
            # were taken without it. Set KDB_TAP_DIR (and size KDB_TAP_MAX_MB against the disk) for
            # a capture run — the tap caps itself at 256 MB either way so a flood cannot starve the
            # Archive of disk. Deliberately a one-value edit, mirroring the OTEL overlay's rule.
            # OTEL-01: tracing knobs, present-but-off on GKE. The benchmark that proves this
            # costs nothing on the trade path is a TIMING claim, so the "off" arm must be the
            # deployed default and the "on" arm must be reachable without a rebuild. Flip
            # OTEL_TRACES to "1" (both here and on the peer manifest) to take the "on" run.
            - name: OTEL_TRACES
              value: "0"
            - name: OTEL_ENDPOINT
              value: "http://otel-collector:4318"
            # 1 in 128. At ~190k orders/s a per-order span is its own performance problem; head
            # sampling is what keeps tracing affordable at the rates this cluster actually runs.
            - name: OTEL_SAMPLE_MASK
              value: "127"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 1Gi
