# Test-only overrides so the inherited @SpringBootTest smoke test can load a context with no
# external infrastructure. Production config (src/main/resources) points at MariaDB and NATS and
# is untouched. This file only exists on the TEST classpath.
spring.datasource.url=jdbc:h2:mem:traderx;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
server.port=0
# the EOD consumer dials NATS on startup; a context-load smoke test must not need a broker
eod.consumer.enabled=false
