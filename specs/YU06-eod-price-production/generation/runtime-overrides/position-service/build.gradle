import org.gradle.api.tasks.PathSensitivity

plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.7'
}

ext['jackson-bom.version'] = '2.22.1'
ext['tomcat.version'] = '10.1.57'

group = 'finos.traderx.position-service-specfirst'
version = '0.1.0'

java {
  sourceCompatibility = JavaVersion.VERSION_21
}

// Test sources for this project live at src/main/test/java (a pre-existing TraderX convention),
// which Gradle does not pick up by default — without this the inherited @SpringBootTest smoke
// test reports NO-SOURCE and silently never runs. Same fix brief 03 applied to the templates;
// this is the COMPOSED layer, which brief 03 deferred.
sourceSets {
  test {
    java.srcDirs = ["src/test/java", "src/main/test/java"]
    resources.srcDirs = ["src/test/resources", "src/main/test/resources"]
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.9'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'

  // YU06 (eod-price-production): durable JetStream consumer of EOD_PRICES_READY + JSON parsing of
  // the event payload. Same io.nats client and version YU04/trade-processor already use.
  implementation 'io.nats:jnats:2.20.5'
  implementation('org.json:json:20240303') {
    because 'previous versions are affected by multiple CVE'
  }

  implementation ('ch.qos.logback:logback-core:1.5.34') {
    because 'version brought in by spring boot 3.5.14 affected by CVE-2024-12798'
  }
  implementation 'ch.qos.logback:logback-classic:1.5.34'
  implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
  implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.26.1'
  implementation 'org.apache.commons:commons-lang3:3.20.0'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'com.h2database:h2:2.3.232'

  // Container-backed tier. The EOD chain's two hardest properties -- that an already-existing
  // JetStream stream gets REPAIRED rather than accepted, and that the P&L write is idempotent
  // across a reprocess -- live in the broker and the database, not in application code, so a
  // mock cannot reach them: a mocked JetStreamManagement returns whatever the caller expects.
  testImplementation 'org.testcontainers:testcontainers:1.20.4'
  testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
  testImplementation 'org.testcontainers:mariadb:1.20.4'
  // The driver is already runtimeOnly for the app; testRuntimeOnly extends runtimeOnly, so it is
  // on the test runtime classpath too and does not need repeating.
}

// This block must stay ABOVE the `test` block and the integrationTest registration below.
// configureEach applies to tasks as they are realised; declaring it after a task that sets its own
// useJUnitPlatform { ... } filter overwrites that filter, which silently un-does the tag split and
// lets the container tests run in the fast unit job.
tasks.withType(Test).configureEach {
  useJUnitPlatform()
}

// Unit tier: no container runtime. @Tag("integration") runs in integrationTest instead.
test {
  useJUnitPlatform { excludeTags 'integration' }
}

// Needs a Docker daemon (Testcontainers). Kept OUT of the infrastructure-free unit task so the
// hosted CI job stays fast and Docker-free; run by its own CI job, the same split account-service
// and trade-processor already use.
tasks.register('integrationTest', Test) {
  description = 'EOD stream repair and P&L idempotency against a real broker.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform { includeTags 'integration' }
  shouldRunAfter test

  // The deployed schema is a real INPUT of these tests -- EodSnapshotAndPnlIT applies the ConfigMap's
  // DDL verbatim -- but Gradle cannot know that, so without this a DDL-only edit leaves the task
  // UP-TO-DATE and the previous run's results stand. Found the hard way: deleting the PRIMARY KEY
  // from eod_position_pnl appeared to change nothing, because the suite never re-ran and the stale
  // green XML was still on disk. Declared, so a schema change re-runs the tests that check it.
  inputs.file("../kubernetes-runtime/manifests/base/database-init-configmap.yaml")
    .withPropertyName('deployedSchema')
    .withPathSensitivity(PathSensitivity.RELATIVE)
    .optional()
}
