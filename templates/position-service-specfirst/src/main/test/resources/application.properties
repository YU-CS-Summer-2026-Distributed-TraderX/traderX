# Test-only overrides: the production config points at a networked H2 (jdbc:h2:tcp://...:18082),
# unreachable in a unit-test JVM. Use an in-memory H2 so the @SpringBootTest smoke test can load a
# context without any external process. This file shadows the main application.properties on the
# test classpath, so it also carries the one placeholder the context dereferences (${server.port}).
spring.datasource.url=jdbc:h2:mem:traderx;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
server.port=0
