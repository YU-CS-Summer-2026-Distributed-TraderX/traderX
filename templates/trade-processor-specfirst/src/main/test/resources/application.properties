# Test-only overrides: the production config points at a networked H2 (jdbc:h2:tcp://...:18082),
# which is unreachable in a unit-test JVM. Point the Spring context at an in-memory H2 instead so
# the @SpringBootTest smoke test can load a context (schema built from the JPA entities) without any
# external process. Production application.properties (src/main/resources) is untouched.
spring.datasource.url=jdbc:h2:mem:traderx;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.data.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# This file fully shadows the main application.properties on the test classpath, so it must also
# carry the two placeholders the context dereferences (${server.port}, ${trade.feed.address}).
server.port=0
trade.feed.address=http://localhost:0
