plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.7'
}

ext['jackson-bom.version'] = '2.22.1'
ext['tomcat.version'] = '10.1.57'

group = 'finos.traderx.trade-processor-specfirst'
version = '0.1.0'

java {
  sourceCompatibility = JavaVersion.VERSION_21
}

// This project's test sources live at src/main/test/java (a pre-existing convention across
// several TraderX baseline services), which Gradle's Java plugin does not pick up by default
// (its default test source dir is src/test/java) — without this, `./gradlew test` silently
// reports NO-SOURCE and every test here never actually runs.
sourceSets {
  test {
    java.srcDirs = ['src/main/test/java']
    resources.srcDirs = ['src/main/test/resources']
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'com.h2database:h2:2.4.240'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'
  implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
  implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.26.1'

  implementation('org.json:json:20240303') {
    because 'previous versions are affected by multiple CVE'
  }
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10'
  implementation('io.socket:socket.io-client:2.1.2') {
    exclude group: 'org.json', module: 'json'
  }
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation ('ch.qos.logback:logback-core:1.5.34') {
    because 'version brought in by spring boot affected by CVE-2024-12798'
  }
  implementation 'ch.qos.logback:logback-classic:1.5.34'
  implementation 'org.apache.commons:commons-lang3:3.20.0'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'

  // Integration-test only: a real MariaDB via Testcontainers + the MariaDB JDBC driver. The
  // deployed trade-processor (YU02+) runs on MariaDB with ddl-auto=none against the configmap
  // schema, so the persistence seam can only be tested against a real MariaDB, not H2.
  testImplementation 'org.testcontainers:mariadb:1.20.4'
  testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
  testImplementation 'org.mariadb.jdbc:mariadb-java-client:3.5.9'
}

// The fast unit `test` task stays infrastructure-free (no Docker) so it runs on any hosted CI
// runner; integration tests (tagged "integration", needing a Docker daemon for Testcontainers)
// run only under the separate `integrationTest` task. Same test source set, split by JUnit tag.
test {
  useJUnitPlatform { excludeTags 'integration' }
}

tasks.register('integrationTest', Test) {
  description = 'Runs @Tag("integration") tests (Testcontainers MariaDB — needs a Docker daemon).'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform { includeTags 'integration' }
  shouldRunAfter test
}

configurations.configureEach {
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
