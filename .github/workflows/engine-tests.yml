name: Engine Tests (JUnit + gates)

# Runs the engine-layer JUnit suites and the allocation / Epsilon gates that
# already exist but had never run in CI. See docs/handoff/production-readiness/
# 04-RESULT-ci-bringup.md and 02-RESULT-coverage-map.md.
#
# Parameterised by branch (matrix) from day one: each YU branch renders its OWN
# effective tree (last-wins layering), so the same test name runs against
# different actual code per branch. Running the matrix is how a propagation /
# dead-layer regression — a fix live on one branch but shadowed/inert on another —
# becomes visible. Enabled for YU15 first; adding YU13/YU14 is a one-line change.

on:
  push:
    branches:
      - YU13-limit-order-book
      - YU14-listed-equity-options
      - YU15-eod-risk-extract
  pull_request:
  workflow_dispatch:

concurrency:
  # Never let two runs of the same ref race — concurrent gradle is exactly what
  # trips ThreeMemberClusterTest / SnapshotBarrierPerformanceTest.
  group: engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: hosted — functional + allocation gates (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          # Each renders its OWN effective tree (last-wins layering), so the same test name
          # runs against different composed code per branch — this is where a dead-layer /
          # propagation regression surfaces. All three validated green locally 2026-07-25
          # (YU13 270 / YU14 284 / YU15 298, 0 fail). YU13/YU14 carry engine-tests.sh +
          # exclude-heavy.gradle so the matrix leg's workspace checkout has them.
          - YU15-eod-risk-extract
          - YU14-listed-equity-options
          - YU13-limit-order-book
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install shell dependencies
        # ubuntu-latest ships jq but NOT ripgrep; generate-state.sh needs rg from
        # its very first step (validate-template-version-consistency.sh). Same
        # install the docs/spec-kit workflows already do.
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Render effective tree (${{ matrix.branch }})
        run: TRADERX_SKIP_LOCKFILE_REFRESH=1 bash pipeline/generate-state.sh ${{ matrix.branch }}
      - name: Run functional suite + allocation gates
        run: bash scripts/ci/engine-tests.sh hosted
      - name: Run composed service suites (non-order-matcher modules)
        # Deliberately a step in THIS job rather than its own: it reuses the ~117s render above
        # and inherits the branch matrix for free. Covers trade-processor, execution-algo-engine,
        # position-service and account-service — 107 tests on YU13/YU14, 115 on YU15, none of
        # which any pipeline executed before 2026-07-28. Validated green on all three branches
        # locally before being enabled.
        run: bash scripts/ci/service-tests.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-hosted-${{ matrix.branch }}
          path: |
            generated/code/target-generated/order-matcher/build/test-results/**/*.xml
            generated/code/target-generated/*/build/test-results/test/*.xml
          if-no-files-found: warn

  baseline:
    # Unit suites for the plain-vanilla TraderX baseline services we forked (account,
    # trade, position, trade-processor). Standalone gradle projects under templates/ — no
    # effective-tree render needed. These had ZERO tests running in CI (test sources at the
    # non-default src/main/test/java were NO-SOURCE until the sourceSets fix). See
    # docs/handoff/production-readiness/03-baseline-unit-tests.md.
    name: baseline — inherited Spring services (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run baseline service unit suites
        run: bash scripts/ci/baseline-tests.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-baseline
          path: templates/*-specfirst/build/test-results/**/*.xml
          if-no-files-found: warn

  baseline-reference-data:
    # Baseline reference-data (NestJS). Tests run on Node's built-in test runner via ts-node
    # (already a devDependency) — no jest/ts-jest added. See 03-RESULT-baseline-unit-tests.md.
    name: baseline — reference-data (NestJS unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/reference-data-specfirst
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test

  baseline-people-service:
    # Baseline people-service (.NET / xUnit). Separate test project referencing the WebApi.
    name: baseline — people-service (.NET unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run unit tests
        run: dotnet test templates/people-service-specfirst/PeopleService.Tests/PeopleService.Tests.csproj

  integration-trade-processor:
    # Cross-service persistence integration test: the trade-processor booking path against a REAL
    # MariaDB (Testcontainers) loaded with the deployed configmap schema (ddl-auto=none, FK +
    # CHECK constraints). ubuntu-latest ships a Docker daemon, so Testcontainers runs out of the
    # box. Separate from the fast unit `baseline` job (which excludes @Tag("integration")).
    name: integration — trade-processor persistence (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/trade-processor-specfirst
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run integration tests (Testcontainers MariaDB)
        run: ./gradlew integrationTest --console=plain
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-integration-trade-processor
          path: templates/trade-processor-specfirst/build/test-results/integrationTest/**/*.xml
          if-no-files-found: warn

  integration-trade-processor-context:
    # Context-load integration for the COMPOSED trade-processor against a real MariaDB AND a real
    # NATS broker (Testcontainers). This covers the wiring the inherited contextLoads smoke never
    # could: tradePublisher dials nats.address during bean creation, so that test sat in the unit
    # tier passing by never running. Needs the rendered tree, hence the render step.
    name: integration — trade-processor context (MariaDB + NATS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Render effective tree
        run: TRADERX_SKIP_LOCKFILE_REFRESH=1 bash pipeline/generate-state.sh YU15-eod-risk-extract
      - name: Context load against real MariaDB + NATS
        run: cd generated/code/target-generated/trade-processor && ./gradlew --no-daemon --console=plain integrationTest
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-integration-context
          path: generated/code/target-generated/trade-processor/build/test-results/integrationTest/**/*.xml
          if-no-files-found: warn

  integration-account-outbox:
    # Transactional-outbox atomicity for the COMPOSED account-service against a real MariaDB
    # running the deployed DDL AND the deployed server flags (--lower-case-table-names=1, copied
    # from database-deployment.yaml — the account path depends on it and nothing else checks it).
    # The unit-tier AccountOutboxAtomicityTest mocks the outbox repository, so the one property the
    # outbox exists to provide — both writes committing as a unit — is the one it cannot observe.
    # Needs the rendered tree, hence the render step.
    name: integration — account-service outbox atomicity (MariaDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Render effective tree
        run: TRADERX_SKIP_LOCKFILE_REFRESH=1 bash pipeline/generate-state.sh YU15-eod-risk-extract
      - name: Outbox atomicity against real MariaDB
        run: cd generated/code/target-generated/account-service && ./gradlew --no-daemon --console=plain integrationTest
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-integration-account-outbox
          path: generated/code/target-generated/account-service/build/test-results/integrationTest/**/*.xml
          if-no-files-found: warn

  dedicated:
    # Cluster + timing + Epsilon gates. On standard 2-core hosted runners the
    # 3-node cluster test and the 50 ms wall-clock budget are unreliable, so this
    # job is opt-in (manual) rather than gating every PR. To move it onto real
    # dedicated hardware, change `runs-on` to a self-hosted label — nothing else.
    name: dedicated — cluster + timing + Epsilon (YU15)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Render effective tree (YU15)
        run: TRADERX_SKIP_LOCKFILE_REFRESH=1 bash pipeline/generate-state.sh YU15-eod-risk-extract
      - name: Run cluster + timing + Epsilon gates
        run: bash scripts/ci/engine-tests.sh dedicated
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-dedicated-YU15
          path: generated/code/target-generated/order-matcher/build/test-results/**/*.xml
          if-no-files-found: warn
