name: Engine Tests (JUnit + gates)

# Runs the engine-layer JUnit suites and the allocation / Epsilon gates that
# already exist but had never run in CI. See docs/handoff/production-readiness/
# 04-RESULT-ci-bringup.md and 02-RESULT-coverage-map.md.
#
# Parameterised by branch (matrix) from day one: each YU branch renders its OWN
# effective tree (last-wins layering), so the same test name runs against
# different actual code per branch. Running the matrix is how a propagation /
# dead-layer regression — a fix live on one branch but shadowed/inert on another —
# becomes visible. Enabled for YU15 first; adding YU13/YU14 is a one-line change.

on:
  push:
    branches:
      - YU13-limit-order-book
      - YU14-listed-equity-options
      - YU15-eod-risk-extract
  pull_request:
  workflow_dispatch:

concurrency:
  # Never let two runs of the same ref race — concurrent gradle is exactly what
  # trips ThreeMemberClusterTest / SnapshotBarrierPerformanceTest.
  group: engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: hosted — functional + allocation gates (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - YU15-eod-risk-extract
          # Enable after YU15 is green — one line each. Each renders its own
          # effective tree; this is where dead-layer/propagation regressions surface.
          # - YU14-listed-equity-options
          # - YU13-limit-order-book
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install shell dependencies
        # ubuntu-latest ships jq but NOT ripgrep; generate-state.sh needs rg from
        # its very first step (validate-template-version-consistency.sh). Same
        # install the docs/spec-kit workflows already do.
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Render effective tree (${{ matrix.branch }})
        run: TRADERX_SKIP_LOCKFILE_REFRESH=1 bash pipeline/generate-state.sh ${{ matrix.branch }}
      - name: Run functional suite + allocation gates
        run: bash scripts/ci/engine-tests.sh hosted
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-hosted-${{ matrix.branch }}
          path: generated/code/target-generated/order-matcher/build/test-results/**/*.xml
          if-no-files-found: warn

  baseline:
    # Unit suites for the plain-vanilla TraderX baseline services we forked (account,
    # trade, position, trade-processor). Standalone gradle projects under templates/ — no
    # effective-tree render needed. These had ZERO tests running in CI (test sources at the
    # non-default src/main/test/java were NO-SOURCE until the sourceSets fix). See
    # docs/handoff/production-readiness/03-baseline-unit-tests.md.
    name: baseline — inherited Spring services (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run baseline service unit suites
        run: bash scripts/ci/baseline-tests.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-baseline
          path: templates/*-specfirst/build/test-results/**/*.xml
          if-no-files-found: warn

  baseline-reference-data:
    # Baseline reference-data (NestJS). Tests run on Node's built-in test runner via ts-node
    # (already a devDependency) — no jest/ts-jest added. See 03-RESULT-baseline-unit-tests.md.
    name: baseline — reference-data (NestJS unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/reference-data-specfirst
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test

  baseline-people-service:
    # Baseline people-service (.NET / xUnit). Separate test project referencing the WebApi.
    name: baseline — people-service (.NET unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run unit tests
        run: dotnet test templates/people-service-specfirst/PeopleService.Tests/PeopleService.Tests.csproj

  dedicated:
    # Cluster + timing + Epsilon gates. On standard 2-core hosted runners the
    # 3-node cluster test and the 50 ms wall-clock budget are unreliable, so this
    # job is opt-in (manual) rather than gating every PR. To move it onto real
    # dedicated hardware, change `runs-on` to a self-hosted label — nothing else.
    name: dedicated — cluster + timing + Epsilon (YU15)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: YU15-eod-risk-extract
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Render effective tree (YU15)
        run: TRADERX_SKIP_LOCKFILE_REFRESH=1 bash pipeline/generate-state.sh YU15-eod-risk-extract
      - name: Run cluster + timing + Epsilon gates
        run: bash scripts/ci/engine-tests.sh dedicated
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: junit-dedicated-YU15
          path: generated/code/target-generated/order-matcher/build/test-results/**/*.xml
          if-no-files-found: warn
