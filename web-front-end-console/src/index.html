<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TraderX Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The .ico that ships with `ng new` is the ANGULAR logo; this one is TraderX's, copied from
       the original app. Both declared: browsers prefer the PNG when offered, and some only
       ever ask for /favicon.ico. Absolute paths so they resolve against the origin, not
       against whatever client route the user happens to be on. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <!-- Archivo Black for the masthead's "Console" only. Chosen by rendering the candidates beside
       the actual TraderX mark and comparing letterforms, not from memory: the wordmark is a heavy
       grotesque with flat, wide letters, which Overpass and the system stack both miss by being
       narrower and rounder. Everything else stays on the system stack; the fallback chain means an
       offline session degrades to the previous letterforms rather than to something unstyled. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
