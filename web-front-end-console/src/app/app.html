<header>
  <div class="inner">
    <span class="brand">TraderX <b>Console</b></span>
    <nav>
      <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }">Trading</a>
      <a routerLink="/system" routerLinkActive="on">System</a>
      <a routerLink="/eod" routerLinkActive="on">End of day</a>
      <a routerLink="/admin" routerLinkActive="on">Admin</a>
    </nav>
    <span class="spacer"></span>
    @if (rigUp() !== null) {
      <span class="pill" [class.good]="rigUp()" [class.bad]="!rigUp()">
        {{ rigUp() ? 'rig connected' : 'rig unreachable' }}
      </span>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
