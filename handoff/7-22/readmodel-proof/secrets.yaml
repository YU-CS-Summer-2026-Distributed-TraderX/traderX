# Dev-only secrets for the Brief 07 read-model proof stack. NOT for a real deployment — these are
# the code's dev defaults (traderx/traderx), matched so the MariaDB init and trade-processor agree.
# auth-secrets values are dummies: trade-processor has no enforced security filter (no
# spring-boot-starter-security, JwtAuthenticator is not wired as a filter), so GET /accounts/{id}/orders
# is open and the JWT values are never checked — they only exist to satisfy the deployment's secretKeyRefs.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-credentials
  namespace: traderx
type: Opaque
stringData:
  username: traderx
  password: traderx
  root-password: traderxroot
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: traderx
type: Opaque
stringData:
  jwt-secret: dev-jwt-secret-not-enforced-in-readmodel-proof
  dev-token-master-secret: dev-token-master-not-enforced
