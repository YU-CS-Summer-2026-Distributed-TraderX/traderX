apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: order-matcher-yu09-pipeline
description: >
  order-matcher (BLP) CI/CD for the YU09-ops-hardening state (journal archival + secret-sourced
  credentials). Single target (the live traderx-lmax cluster) with a required manual-approval
  gate before anything is applied, so a push never silently changes what's running in production.
  Separate from the YU02 order-matcher-pipeline; only one trigger should feed the shared cluster.
serialPipeline:
  stages:
    - targetId: production
      strategy:
        standard:
          # After the StatefulSet is applied, run the promote-blp-mode action (skaffold.yaml
          # customActions): it reads the live blp-pool node count and sets single-BLP vs HA
          # (replicas + BLP_REPLICATION_ENABLED) automatically.
          postdeploy:
            actions:
              - promote-blp-mode
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: production
description: traderx-lmax GKE cluster, traderx namespace
requireApproval: true
gke:
  cluster: projects/traderx-501015/locations/us-east1-b/clusters/traderx-lmax
executionConfigs:
  - usages:
      - RENDER
      - DEPLOY
      # POSTDEPLOY is required because the production stage enables a postdeploy hook
      # (promote-blp-mode); it's the execution env Cloud Deploy runs that hook container in.
      - POSTDEPLOY
    serviceAccount: traderx-cicd@traderx-501015.iam.gserviceaccount.com
    # Default execution-config artifact bucket uses App Engine's domain-verified naming
    # convention (<region>.deploy-artifacts.<project>.appspot.com), which only Cloud Deploy's
    # own internal identity can provision — not creatable via a normal gcloud storage call.
    # Use a plain project-owned bucket instead.
    artifactStorage: gs://traderx-501015-clouddeploy-artifacts
