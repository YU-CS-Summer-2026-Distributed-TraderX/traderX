# The production JetStream settings (specs/YU18-risk-integration/generation/kubernetes/cluster/gke/nats.yaml),
# with the server-wide store cap sized for a full-rate 10-minute run instead of 24G.
port: 4222
http: 8222
max_payload: 1MB
jetstream {
  store_dir: /data/nats
  max_file_store: 950G
  max_buffered_msgs: 2000000
  max_buffered_size: 1GB
}
