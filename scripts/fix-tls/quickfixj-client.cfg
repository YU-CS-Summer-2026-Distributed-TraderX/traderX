# ADR-095: a QuickFIX/J initiator for the external FIX-over-TLS entry (fix.yaakovseif.dev).
# ${...} are Java system properties; fix-tls-smoke.sh sets them, or pass -Dfix.host=... to your own client.
# QuickFIX/J 2.3 does NOT check the server's hostname and, with no SocketTrustStore, trusts ANY certificate.
# So the trust store is the pin: it holds exactly the gateway's certificate (provision-fix-tls.py writes it).
[default]
ConnectionType=initiator
BeginString=FIX.4.4
SenderCompID=${fix.sender}
TargetCompID=TRADERX
SocketConnectHost=${fix.host}
SocketConnectPort=${fix.port}
SocketUseSSL=Y
SocketTrustStore=${fix.truststore}
SocketTrustStorePassword=${fix.truststore.password}
TrustStoreType=PKCS12
EnabledProtocols=TLSv1.3,TLSv1.2
# FIX logon auth (ADR-082): TLS protects the password, it does not replace it.
LogonTag=554=${fix.password}
HeartBtInt=30
ReconnectInterval=5
StartTime=00:00:00
EndTime=00:00:00
# A fresh session per run (141=Y). To resume across reconnects instead (ADR-086 keeps the acceptor's side on any
# replica), set ResetOnLogon=N and give your client a FileStorePath.
ResetOnLogon=Y
UseDataDictionary=N

[session]
