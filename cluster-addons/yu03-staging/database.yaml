# Self-contained MariaDB for the YU03 staging namespace. Deliberately ephemeral (emptyDir, no
# PVC) — this environment exists to validate that a YU03 build deploys and comes up healthy, not
# to persist state across restarts. Same schema as production (kubernetes-runtime/manifests/base),
# copied rather than shared so staging never touches the production database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: traderx-yu03-staging
  labels:
    app: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: mariadb:11.4
          args: ["--lower-case-table-names=1", "--innodb-flush-log-at-trx-commit=2"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: mariadb
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: "traderx"
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: root-password
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
            - name: database-init-sql
              mountPath: /docker-entrypoint-initdb.d/001-initialSchema.sql
              subPath: 001-initialSchema.sql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -u\"$MARIADB_USER\" -p\"$MARIADB_PASSWORD\" --silent"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -u\"$MARIADB_USER\" -p\"$MARIADB_PASSWORD\" --silent"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: db-data
          emptyDir: {}
        - name: database-init-sql
          configMap:
            name: database-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: traderx-yu03-staging
  labels:
    app: database
spec:
  type: ClusterIP
  selector:
    app: database
  ports:
    - name: mariadb
      protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init-sql
  namespace: traderx-yu03-staging
data:
  001-initialSchema.sql: |
    DROP TABLE IF EXISTS trades;
    DROP TABLE IF EXISTS orderbook;
    DROP TABLE IF EXISTS accountusers;
    DROP TABLE IF EXISTS positions;
    DROP TABLE IF EXISTS accounts;
    DROP SEQUENCE IF EXISTS accounts_seq;

    CREATE TABLE accounts (
      id INTEGER PRIMARY KEY,
      displayname VARCHAR(50)
    );

    CREATE TABLE accountusers (
      accountid INTEGER NOT NULL,
      username VARCHAR(15) NOT NULL,
      PRIMARY KEY (accountid, username),
      FOREIGN KEY (accountid) REFERENCES accounts(id)
    );

    CREATE TABLE positions (
      accountid INTEGER,
      security VARCHAR(15),
      updated DATETIME,
      quantity INTEGER,
      averagecostbasis DECIMAL(18,3),
      PRIMARY KEY (accountid, security),
      FOREIGN KEY (accountid) REFERENCES accounts(id)
    );

    CREATE TABLE trades (
      id VARCHAR(50) PRIMARY KEY,
      accountid INTEGER REFERENCES accounts(id),
      created DATETIME,
      updated DATETIME,
      security VARCHAR(15),
      side VARCHAR(10) CHECK (side in ('Buy', 'Sell')),
      quantity INTEGER CHECK (quantity > 0),
      price DECIMAL(18,3),
      state VARCHAR(20) CHECK (state in ('New', 'Processing', 'Settled', 'Cancelled'))
    );

    CREATE TABLE orderbook (
      orderid VARCHAR(32) PRIMARY KEY,
      accountid INTEGER NOT NULL,
      security VARCHAR(16) NOT NULL,
      side VARCHAR(16) CHECK (side in ('Buy', 'Sell')),
      quantity INTEGER NOT NULL CHECK (quantity > 0),
      remainingquantity INTEGER NOT NULL CHECK (remainingquantity >= 0),
      limitprice DECIMAL(18,3) NOT NULL,
      status VARCHAR(24) CHECK (status in ('NEW', 'PARTIALLY_FILLED', 'FILLED', 'CANCELED', 'REJECTED')),
      createdat DATETIME NOT NULL,
      updatedat DATETIME NOT NULL,
      lastexecutionprice DECIMAL(18,3),
      lastfillquantity INTEGER
    );
    CREATE INDEX idx_orderbook_status ON orderbook(status);
    CREATE INDEX idx_orderbook_updatedat ON orderbook(updatedat);

    CREATE SEQUENCE accounts_seq START WITH 65000 INCREMENT BY 1;

