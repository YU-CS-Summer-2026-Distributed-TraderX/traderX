# Single-replica, ephemeral order-matcher for the YU03 staging namespace. No PVC (emptyDir) since
# this environment exists to validate a build deploys and the risk gateway comes up correctly, not
# to persist state across restarts. RISK_BOOTSTRAP_ENABLED=false because account-service and
# reference-data aren't deployed in this minimal namespace — the Gateway replica runs on the
# risk.seed.* config below instead of fetching from those services (see ReplicaBootstrap.java's
# documented fallback: "running on configuration seeds only").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-matcher
  namespace: traderx-yu03-staging
  labels:
    app: order-matcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-matcher
  template:
    metadata:
      labels:
        app: order-matcher
    spec:
      containers:
        - name: order-matcher
          image: us-east1-docker.pkg.dev/traderx-501015/traderx/order-matcher-yu03-staging
          ports:
            - name: http
              containerPort: 18110
              protocol: TCP
          env:
            - name: ORDER_MATCHER_PORT
              value: "18110"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0"
            - name: BLP_REPLICATION_ENABLED
              value: "false"
            - name: DATABASE_PG_HOST
              value: "database"
            - name: DATABASE_PG_PORT
              value: "3306"
            - name: DATABASE_NAME
              value: "traderx"
            - name: DATABASE_DBUSER
              value: "traderx"
            - name: DATABASE_DBPASS
              value: "traderx"
            - name: NATS_BROKER_HOST
              value: "nats-broker"
            - name: CORS_ALLOWED_ORIGINS
              value: "*"
            - name: PRICE_SERVICE_URL
              value: "http://price-publisher:18100"
            - name: TRADE_SERVICE_URL
              value: "http://trade-service:18092/trade/"
            - name: ORDER_FILL_FULL_THRESHOLD
              value: "1000"
            - name: RUNTIME_PROFILE
              value: "demo"
            - name: DISRUPTOR_INPUT_RING_SIZE
              value: "65536"
            - name: DISRUPTOR_OUTPUT_RING_SIZE
              value: "65536"
            - name: ORDER_MATCHER_JOURNAL_ENABLED
              value: "true"
            - name: ORDER_MATCHER_JOURNAL_PATH
              value: "/var/lib/traderx-lmax/journal"
            - name: JOURNAL_REPLAY_VERIFY
              value: "true"
            - name: OUTPUT_LEGACY_TRADES_ENABLED
              value: "false"
            - name: OUTPUT_PROJECTOR_BATCH_SIZE
              value: "500"
            - name: OUTPUT_PROJECTOR_QUEUE_CAPACITY
              value: "1000000"
            - name: OUTPUT_PROJECTOR_DB_ENABLED
              value: "true"
            - name: BLP_MAX_SECURITIES
              value: "4096"
            - name: BLP_BOOK_POOL_SIZE
              value: "65536"
            - name: BLP_GATEWAY_ACK_TIMEOUT_MS
              value: "5000"
            - name: SNAPSHOT_INTERVAL_MS
              value: "300000"
            - name: RECOVERY_SOURCE
              value: "journal"
            - name: ORDER_MATCHER_JOURNAL_BATCH_RECORDS
              value: "1024"
            - name: BLP_TERMINAL_RETAIN
              value: "262144"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,prometheus,info"
            - name: MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_READINESSSTATE_ENABLED
              value: "true"
            # --- risk gateway (YU03) ---
            - name: RISK_ENABLED
              value: "true"
            - name: RISK_SEED_ACCOUNTS
              value: "22214,44044,52355,10031,62654"
            - name: RISK_SEED_SECURITIES
              value: "IBM,MSFT,JPM,GS,NVDA,C,META,MS,BAC,PARITYA,PARITYB,PARITYC,PARITYD,PARITYE,POSBUY,POSSELL,POSMKT"
            - name: RISK_MAX_ACCOUNTS
              value: "4096"
            - name: RISK_MAX_ORDER_QUANTITY
              value: "1000000"
            - name: RISK_MAX_ORDER_NOTIONAL_TICKS
              value: "1000000000000000"
            - name: RISK_MAX_POSITION_QUANTITY
              value: "1000000"
            - name: RISK_MAX_CONCENTRATION_NOTIONAL_TICKS
              value: "5000000000000000"
            - name: RISK_CREDIT_LIMIT_TICKS
              value: "5000000000000000"
            - name: RISK_PRICE_MAX_AGE_MS
              value: "30000"
            - name: RISK_PRICE_COLLAR_BPS
              value: "5000"
            - name: RISK_IDEMPOTENCY_CAPACITY
              value: "65536"
            - name: RISK_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: yu03-staging-risk-control
                  key: token
            - name: RISK_BOOTSTRAP_ENABLED
              value: "false"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: lmax-runtime-data
              mountPath: /var/lib/traderx-lmax
      volumes:
        - name: lmax-runtime-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-matcher
  namespace: traderx-yu03-staging
  labels:
    app: order-matcher
spec:
  type: ClusterIP
  selector:
    app: order-matcher
  ports:
    - name: http
      protocol: TCP
      port: 18110
      targetPort: 18110
